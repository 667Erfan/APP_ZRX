<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ticket_me</title>
  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:#070A12;
      color:#eaf2ff;
    }
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    .card{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      border-radius:18px;
      padding:14px;
      margin-top:14px;
    }
    h2{margin:0 0 10px;font-size:18px}
    .small{font-size:13px;opacity:.75;margin-top:6px}
    .ticketList{display:flex;flex-direction:column;gap:10px;margin-top:12px}
    .ticket{
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      padding:10px 12px;
    }
    .head{
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
      justify-content:space-between;
      margin-bottom:6px;
    }
    .who{font-weight:1000}
    .time{opacity:.7;font-size:12px}
    .body{white-space:pre-wrap;opacity:.95}
    .replyBox{
      margin-top:10px;
      background:rgba(56,189,248,.10);
      border:1px solid rgba(56,189,248,.22);
      padding:10px;
      border-radius:12px;
    }
    .imgWrap{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .thumb{
      width:120px;
      max-width:38vw;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04);
      overflow:hidden;
    }
    .thumb img{
      width:100%;
      height:100px;
      object-fit:cover;
      display:block;
    }
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>📩 تیکت‌های من</h2>
      <div class="small">Zrx Ticket</div>

      <div id="emptyState" class="small" style="margin-top:12px;opacity:.85">فعلاً تیکتی برای شما پیدا نشده است.</div>
      <div id="ticketList" class="ticketList"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "ticket_messages_v3";
    const OWNER_ID_KEY = "ticket_owner_id_v3";

    function getOwnerId(){
      return localStorage.getItem(OWNER_ID_KEY) || "";
    }

    function loadTickets(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      }catch{
        return [];
      }
    }

    function formatTime(ts){
      const d = new Date(ts);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      return `${y}/${m}/${day} - ${hh}:${mm}`;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function render(){
      const ownerId = getOwnerId();
      const all = loadTickets();

      const ticketListEl = document.getElementById("ticketList");
      const emptyStateEl = document.getElementById("emptyState");

      ticketListEl.innerHTML = "";

      if (!ownerId){
        emptyStateEl.classList.remove("hidden");
        emptyStateEl.textContent = "اول یک تیکت در در گزارش مشکل ثبت کن تا اینجا نمایش داده شود.";
        return;
      }

      const filtered = all.filter(t => (t.ownerId || "") === ownerId);

      if (!filtered.length){
        emptyStateEl.classList.remove("hidden");
        return;
      }

      emptyStateEl.classList.add("hidden");

      const sorted = [...filtered].sort((a,b) => b.createdAt - a.createdAt);

      for (const t of sorted){
        const div = document.createElement("div");
        div.className = "ticket";

        const imgs = Array.isArray(t.images) ? t.images : [];
        let imgsHtml = "";
        if (imgs.length){
          imgsHtml = `
            <div class="imgWrap">
              ${imgs.map(im => `
                <div class="thumb">
                  <img alt="${escapeHtml(im.name || 'image')}" src="${im.dataUrl}">
                </div>
              `).join("")}
            </div>
          `;
        }

        const hasReply = !!(t.adminReply && String(t.adminReply).trim().length > 0);

        div.innerHTML = `
          <div class="head">
            <div class="who">👤 ${escapeHtml(t.name || "کاربر")}</div>
            <div class="time">${formatTime(t.createdAt)}</div>
          </div>

          <div class="body">📝 ${escapeHtml(t.text || "")}</div>
          ${imgsHtml}

          ${
            hasReply
              ? `<div class="replyBox">
                  <div style="font-weight:1000;opacity:.95">✅ جواب داده شد (${formatTime(t.repliedAt)})</div>
                  <div class="body" style="margin-top:6px">${escapeHtml(t.adminReply)}</div>
                </div>`
              : `<div class="small" style="margin-top:10px;opacity:.8">هنوز جوابی داده نشده.</div>`
          }
        `;
        ticketListEl.appendChild(div);
      }
    }

    render();
  </script>
</body>
</html>
