<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loading...</title>
  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:#070A12;
      color:#eaf2ff;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }
    .box{
      text-align:center;
      padding:24px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      background:rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      width:min(520px, 92vw);
    }
    .spinner{
      width:58px;
      height:58px;
      margin:0 auto 14px;
      border-radius:50%;
      border:6px solid rgba(255,255,255,.15);
      border-top-color: rgba(56,189,248,.95);
      animation: spin 1s linear infinite;
    }
    @keyframes spin{ to { transform: rotate(360deg); } }
    .t{font-weight:900;font-size:18px;margin-bottom:6px}
    .sub{color:rgba(234,242,255,.75);font-size:14px}
    .bar{
      height:10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.12);
      overflow:hidden;
      margin-top:16px;
    }
    .fill{
      height:100%;
      width:0%;
      background:linear-gradient(90deg, rgba(56,189,248,.95), rgba(124,58,237,.95));
      transition: width .2s linear;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="t">در حال ورود...</div>
    <div class="sub" id="sec">5 ثانیه تا شروع</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <script>
    const targetPage = "index.html"; // صفحه اصلی

    let remaining = 5;
    const secEl = document.getElementById("sec");
    const fillEl = document.getElementById("fill");

    const total = 5;
    let elapsed = 0;

    const timer = setInterval(() => {
      remaining--;
      elapsed++;
      secEl.textContent = remaining + " ثانیه تا شروع";

      const percent = Math.min(100, Math.round((elapsed / total) * 100));
      fillEl.style.width = percent + "%";

      if (remaining <= 0) {
        clearInterval(timer);
        window.location.href = targetPage;
      }
    }, 1000);
  </script>
</body>
</html>
