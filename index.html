<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Right Buttons + Text</title>

  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:#070A12;
    }

    /* متن بالا-بالا سمت چپ */
    .top-left-text{
      position: fixed;
      top: 12px;
      left: 12px;          /* سمت چپ */
      z-index: 999999;
      color: #fff;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: .4px;
      text-shadow: 0 10px 30px rgba(0,0,0,.5);
      pointer-events: none;
      user-select: none;
    }

    /* اسکرولی و زیر هم */
    .right-stack{
      display:flex;
      flex-direction:column;
      align-items:flex-end;   /* همه دکمه‌ها سمت راست */
      gap:30px;
      padding: 120px 18px;    /* فضای بالا + فاصله از راست */
    }

    .rb{
      width:200px;
      padding: 12px 14px;
      border:0;
      border-radius:16px;
      cursor:pointer;

      direction: rtl;
      text-align: right;

      color:#05101a;
      font-weight:900;

      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85));
      box-shadow: 0 18px 55px rgba(56,189,248,.18),
                  inset 0 0 0 1px rgba(255,255,255,.18);
      transition: transform .15s ease, filter .2s ease;
    }
    .rb:hover{
      transform: translateX(-4px) translateY(-2px) scale(1.02);
      filter: brightness(1.06) saturate(1.1);
    }

    .b1{ background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85)); }
    .b2{ background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.85)); }
    .b3{ background: linear-gradient(135deg, rgba(236,72,153,.95), rgba(124,58,237,.85)); }
    .b4{ background: linear-gradient(135deg, rgba(245,158,11,.95), rgba(56,189,248,.85)); }
    .b5{ background: linear-gradient(135deg, rgba(20,184,166,.95), rgba(34,197,94,.85)); }
    .b6{ background: linear-gradient(135deg, rgba(59,130,246,.95), rgba(236,72,153,.85)); }
    .b7{ background: linear-gradient(135deg, rgba(248,113,113,.95), rgba(124,58,237,.85)); }
    .b8{ background: linear-gradient(135deg, rgba(99,102,241,.95), rgba(34,197,94,.85)); }
    .b9{ background: linear-gradient(135deg, rgba(34,211,238,.95), rgba(59,130,246,.85)); }
    .b10{ background: linear-gradient(135deg, rgba(217,70,239,.95), rgba(245,158,11,.85)); }

    @media (max-width: 520px){
      .right-stack{ padding: 100px 10px; }
      .rb{ width:160px; }
      .top-left-text{ font-size:18px; }
    }
  </style>
</head>
<body>

  <div class="top-left-text">Zrx_MINE</div>

  <div class="right-stack">
    <button class="rb b1" type="button">خانه</button>
    <button class="rb b2" type="button">سرور</button>
    <button class="rb b3" type="button">نسخه</button>
    <button class="rb b4" type="button">پروفایل</button>
    <button class="rb b5" type="button">مود پک ها</button>
    <button class="rb b6" type="button">گفتگو صوتی</button>
    <button class="rb b7" type="button">رادیو</button>
    <button class="rb b8" type="button">حساب کاربری</button>
    <button class="rb b9" type="button">هوش مصنوعی</button>
    <button class="rb b10" type="button">گزارش مشکل</button>
  </div>

</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Animated Background</title>
  <style>
    :root{
      --bg1:#060816;
      --bg2:#0b1030;
      --a:#7c3aed;
      --b:#06b6d4;
      --c:#22c55e;
      --d:#f97316;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(900px 650px at 15% 10%, rgba(124,58,237,.22), transparent 55%),
        radial-gradient(900px 700px at 85% 30%, rgba(6,182,212,.18), transparent 55%),
        radial-gradient(800px 650px at 50% 90%, rgba(34,197,94,.15), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      color:#eaf0ff;
    }

    /* GLows */
    .glows{
      position:fixed; inset:0;
      pointer-events:none;
      filter:saturate(1.2);
    }
    .glow{
      position:absolute;
      border-radius:50%;
      mix-blend-mode:screen;
      opacity:.8;
      transform: translateZ(0);
      will-change: transform;
      animation: floaty 12s ease-in-out infinite;
      width:min(46vmin, 560px);
      height:min(46vmin, 560px);
      left:calc(var(--gx1, -10vw));
      top:calc(var(--gy1, -10vw));
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.30), transparent 45%),
        radial-gradient(circle at 50% 55%, rgba(124,58,237,.60), rgba(6,182,212,.22) 45%, transparent 66%);
    }
    .glow:nth-child(2){
      width:min(42vmin, 500px);
      height:min(42vmin, 500px);
      left:auto; right:calc(var(--gx2, -12vw));
      top:calc(var(--gy2, 8vw));
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.26), transparent 45%),
        radial-gradient(circle at 50% 55%, rgba(6,182,212,.65), rgba(34,197,94,.18) 45%, transparent 66%);
      animation-duration: 14s;
      animation-delay: -3s;
    }
    .glow:nth-child(3){
      width:min(50vmin, 640px);
      height:min(50vmin, 640px);
      left:calc(var(--gx3, 18vw));
      top:auto; bottom:calc(var(--gy3, -22vw));
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 45%),
        radial-gradient(circle at 50% 55%, rgba(34,197,94,.55), rgba(249,115,22,.18) 45%, transparent 66%);
      animation-duration: 16s;
      animation-delay: -6s;
    }

    @keyframes floaty{
      0%,100%{ transform: translate3d(0,0,0) scale(1); }
      35%{ transform: translate3d(6vw, 4vw, 0) scale(1.06); }
      70%{ transform: translate3d(-5vw, 2vw, 0) scale(.98); }
    }

    /* Stars */
    .stars{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.95;
      transform: translateZ(0);
    }
    .star{
      position:absolute;
      width:2px; height:2px;
      border-radius:50%;
      background: rgba(255,255,255,.9);
      box-shadow: 0 0 12px rgba(255,255,255,.35);
      animation: twinkle var(--tw, 2.8s) ease-in-out infinite;
      opacity: var(--op, .7);
      will-change: transform, opacity;
    }
    @keyframes twinkle{
      0%,100%{ transform: scale(.9); opacity:.25; }
      50%{ transform: scale(1.45); opacity: 1; }
    }

    /* Grid + scanline */
    .fx{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:1;
    }
    .grid{
      position:absolute; inset:0;
      background:
        linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at 50% 30%, rgba(0,0,0,.95), rgba(0,0,0,.16) 60%, transparent 76%);
      opacity:.55;
      transform: translateZ(0);
    }
    .scan{
      position:absolute; inset:-45%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.09), transparent);
      transform: rotate(12deg) translateX(-35%);
      animation: sweep 7s linear infinite;
      opacity:.55;
      mix-blend-mode: screen;
      will-change: transform;
    }
    @keyframes sweep{
      0%{ transform: rotate(12deg) translateX(-40%); }
      100%{ transform: rotate(12deg) translateX(40%); }
    }

    /* Mouse parallax (works on mouse and touch move) */
    .parallax{
      position:fixed; inset:0;
      pointer-events:none;
      transform: translateZ(0);
    }
    .parallax .p1{ position:absolute; inset:0; transform: translate3d(calc((var(--px) - .5) * -18px), calc((var(--py) - .5) * -12px), 0); }
    .parallax .p2{ position:absolute; inset:0; transform: translate3d(calc((var(--px) - .5) * 22px), calc((var(--py) - .5) * 16px), 0); opacity:.9; }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce){
      .glow, .star, .scan{ animation:none !important; }
    }
  </style>
</head>
<body>
  <div class="glows" aria-hidden="true">
    <div class="glow" style="--gx1:-14vw;--gy1:-10vw"></div>
    <div class="glow" style="--gx2:-16vw;--gy2:6vw"></div>
    <div class="glow" style="--gx3:18vw;--gy3:-24vw"></div>
  </div>

  <div class="parallax" aria-hidden="true">
    <div class="p1">
      <div class="fx">
        <div class="grid"></div>
      </div>
    </div>
    <div class="p2">
      <div class="fx">
        <div class="scan"></div>
      </div>
    </div>
  </div>

  <div class="stars" aria-hidden="true" id="stars"></div>

  <script>
    const stars = document.getElementById('stars');
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const density = Math.max(60, Math.min(140, Math.floor((window.innerWidth * window.innerHeight) / 12000)));
    const count = reduce ? Math.floor(density * 0.55) : density;

    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'star';
      const x = Math.random()*100;
      const y = Math.random()*100;
      const size = Math.random() < 0.18 ? 3 : (Math.random() < 0.5 ? 2 : 1.5);
      const op = 0.2 + Math.random()*0.8;
      const tw = 1.6 + Math.random()*3.4;

      s.style.left = x + 'vw';
      s.style.top  = y + 'vh';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.setProperty('--op', op);
      s.style.setProperty('--tw', tw + 's');

      stars.appendChild(s);
    }

    // Parallax pointer (mouse + touch)
    let px = 0.5, py = 0.5;
    document.documentElement.style.setProperty('--px', px);
    document.documentElement.style.setProperty('--py', py);

    function setFromClient(clientX, clientY){
      const w = window.innerWidth || 1;
      const h = window.innerHeight || 1;
      px = Math.min(1, Math.max(0, clientX / w));
      py = Math.min(1, Math.max(0, clientY / h));
      document.documentElement.style.setProperty('--px', px);
      document.documentElement.style.setProperty('--py', py);
    }

    window.addEventListener('pointermove', (e)=>{
      if(e.pointerType === 'mouse' || e.pointerType === 'pen' || e.pointerType === 'touch'){
        setFromClient(e.clientX, e.clientY);
      }
    }, {passive:true});
  </script>
</body>
</html>
