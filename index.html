<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Right 7 Buttons</title>
  <style>
    /* کانتینر: همیشه سمت راست */
    .right-stack{
      position: fixed;
      top: 120px;
      right: 18px;
      z-index: 99999;

      display: flex;
      flex-direction: column; /* زیر هم */
      align-items: flex-end;  /* خود دکمه‌ها چسبیده به راست */
      gap: 30px;               /* فاصله 30px */
      pointer-events: auto;
    }

    .rb{
      direction: rtl;
      text-align: right;

      width: 200px;           /* ثابت که وسط نیفته */
      padding: 12px 14px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 900;
      color: #05101a;

      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85));
      box-shadow: 0 18px 55px rgba(56,189,248,.18), inset 0 0 0 1px rgba(255,255,255,.18);

      transform: translateX(0);
      transition: transform .15s ease, filter .2s ease;
      overflow: hidden;
      position: relative;
    }

    /* انیمیشن ساده خفن */
    .rb:hover{
      transform: translateX(-4px) translateY(-2px) scale(1.02);
      filter: brightness(1.06) saturate(1.1);
    }
    .rb:active{ transform: translateX(-2px) translateY(-1px) scale(1.00); }

    /* رنگ‌های مختلف */
    .b2{ background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.85)); }
    .b3{ background: linear-gradient(135deg, rgba(236,72,153,.95), rgba(124,58,237,.85)); }
    .b4{ background: linear-gradient(135deg, rgba(245,158,11,.95), rgba(56,189,248,.85)); }
    .b5{ background: linear-gradient(135deg, rgba(20,184,166,.95), rgba(34,197,94,.85)); }
    .b6{ background: linear-gradient(135deg, rgba(59,130,246,.95), rgba(236,72,153,.85)); }
    .b7{ background: linear-gradient(135deg, rgba(248,113,113,.95), rgba(124,58,237,.85)); }
  </style>
</head>
<body>

  <div class="right-stack">
    <button class="rb b1" type="button">Button 1</button>
    <button class="rb b2" type="button">Button 2</button>
    <button class="rb b3" type="button">Button 3</button>
    <button class="rb b4" type="button">Button 4</button>
    <button class="rb b5" type="button">Button 5</button>
    <button class="rb b6" type="button">Button 6</button>
    <button class="rb b7" type="button">Button 7</button>
  </div>

</body>
</html>
