<style>
  /* wrapper سمت راست */
  .right-buttons{
    position: fixed;
    right: 18px;
    top: 120px;
    z-index: 99999;

    display: flex;
    flex-direction: column;
    gap: 30px;            /* فاصله 30 */
    align-items: flex-end; /* مهم: چپ/راست بودن خودِ دکمه‌ها */

    pointer-events: auto;
  }

  .rb-btn{
    direction: rtl;
    text-align: right;

    position: relative;
    border: 0;
    cursor: pointer;

    font-weight: 900;
    color: #05101a;
    padding: 12px 16px;
    border-radius: 16px;

    min-width: 170px;
    background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.85));
    box-shadow:
      0 18px 45px rgba(56,189,248,.18),
      0 10px 25px rgba(0,0,0,.25);

    overflow: hidden;
    transition: transform .18s ease, filter .18s ease;
    transform: translateX(0);
  }

  .rb-btn:hover{
    transform: translateX(-3px) translateY(-2px) scale(1.02);
    filter: saturate(1.12) brightness(1.03);
  }

  /* نور */
  .rb-btn::before{
    content:"";
    position:absolute;
    inset:-2px;
    background: radial-gradient(circle at 20% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%);
    opacity:.55;
    transition: opacity .2s ease;
    pointer-events:none;
  }
  .rb-btn:hover::before{ opacity:.85; }

  /* انیمیشن ورود */
  .rb-btn{ animation: floatIn .9s cubic-bezier(.2,.9,.2,1) both; }
  .b1{ background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85)); }
  .b2{ background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.85)); animation-delay:.07s; }
  .b3{ background: linear-gradient(135deg, rgba(236,72,153,.95), rgba(124,58,237,.85)); animation-delay:.14s; }
  .b4{ background: linear-gradient(135deg, rgba(245,158,11,.95), rgba(56,189,248,.85)); animation-delay:.21s; }
  .b5{ background: linear-gradient(135deg, rgba(20,184,166,.95), rgba(34,197,94,.85)); animation-delay:.28s; }
  .b6{ background: linear-gradient(135deg, rgba(59,130,246,.95), rgba(236,72,153,.85)); animation-delay:.35s; }
  .b7{ background: linear-gradient(135deg, rgba(248,113,113,.95), rgba(124,58,237,.85)); animation-delay:.42s; }

  @keyframes floatIn{
    0%   { opacity:0; transform: translateX(26px) translateY(8px) scale(.96); filter: blur(2px); }
    60%  { opacity:1; transform: translateX(0) translateY(0) scale(1.02); filter: blur(0); }
    100% { opacity:1; transform: translateX(0) translateY(0) scale(1); }
  }

  @media (max-width: 520px){
    .right-buttons{
      right: 10px;
      top: 90px;
      gap: 22px;
      align-items: flex-end;
    }
    .rb-btn{ min-width: 150px; }
  }
</style>
