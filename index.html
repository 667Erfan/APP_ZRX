<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>7 Buttons</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: radial-gradient(900px 500px at 20% 10%, rgba(124,58,237,.35), transparent 55%),
                  radial-gradient(900px 500px at 80% 20%, rgba(56,189,248,.28), transparent 55%),
                  radial-gradient(900px 600px at 70% 90%, rgba(34,197,94,.20), transparent 55%),
                  #070A12;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:#EAF0FF;
      padding:24px;
      overflow:hidden;
    }

    .stack{
      width: min(360px, 100%);
      display:flex;
      flex-direction:column;
      gap:30px; /* فاصله 30 */
    }

    .btn{
      position:relative;
      border:none;
      cursor:pointer;
      color:#061116;
      font-weight:900;
      letter-spacing:.2px;
      padding:14px 16px;
      border-radius:18px;
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85));
      box-shadow:
        0 18px 55px rgba(56,189,248,.14),
        inset 0 0 0 1px rgba(255,255,255,.18);
      transform: translateZ(0);
      overflow:hidden;
      transition: transform .15s ease, filter .2s ease;
      min-height:54px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    /* نور موجی */
    .btn::before{
      content:"";
      position:absolute;
      top:-80%;
      left:-40%;
      width:180%;
      height:220%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), rgba(255,255,255,.0) 55%);
      transform: rotate(12deg) translateY(35%);
      opacity:.55;
      transition: opacity .2s ease;
      pointer-events:none;
    }

    /* نوار گرادیانت متحرک */
    .btn::after{
      content:"";
      position:absolute;
      inset:-2px;
      background: conic-gradient(from 180deg, rgba(34,197,94,.0), rgba(34,197,94,.55), rgba(56,189,248,.65), rgba(124,58,237,.65), rgba(34,197,94,.0));
      filter: blur(10px);
      opacity: .0;
      transform: translateY(10px);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events:none;
    }

    .btn:hover{
      transform: translateY(-3px) scale(1.01);
      filter: brightness(1.06);
    }
    .btn:hover::before{ opacity:.9; }
    .btn:hover::after{ opacity:.35; transform: translateY(0); }

    /* آیکن گرد کنار متن */
    .ico{
      width:38px; height:38px;
      border-radius:14px;
      background: rgba(255,255,255,.16);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
      display:grid; place-items:center;
      font-size:18px;
      flex:0 0 auto;
      position:relative;
      overflow:hidden;
    }
    .ico span{
      display:block;
      animation: pop 1.2s ease-in-out infinite alternate;
      transform-origin:center;
    }
    @keyframes pop{
      from{ transform: translateY(0) scale(.98); opacity:.9; }
      to{ transform: translateY(-2px) scale(1.05); opacity:1; }
    }

    /* فلش کوچک زیر دکمه هنگام کلیک */
    .btn:active{
      transform: translateY(-1px) scale(.99);
    }
    .btn .spark{
      position:absolute;
      left:50%;
      top:50%;
      width:10px; height:10px;
      background: rgba(255,255,255,.9);
      border-radius:999px;
      transform: translate(-50%,-50%) scale(0);
      opacity:0;
      pointer-events:none;
    }
    .btn:active .spark{
      animation: spark .35s ease-out;
    }
    @keyframes spark{
      0%{ transform: translate(-50%,-50%) scale(0); opacity:0; }
      15%{ opacity:1; }
      100%{ transform: translate(-50%,-50%) scale(8); opacity:0; }
    }

    /* رنگ‌های متفاوت برای هر دکمه */
    .b1{ background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85)); }
    .b2{ background: linear-gradient(135deg, rgba(56,189,248,.95), rgba(34,197,94,.85)); }
    .b3{ background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(251,191,36,.85)); }
    .b4{ background: linear-gradient(135deg, rgba(251,191,36,.95), rgba(251,113,133,.85)); }
    .b5{ background: linear-gradient(135deg, rgba(251,113,133,.95), rgba(124,58,237,.85)); }
    .b6{ background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(251,113,133,.85)); }
    .b7{ background: linear-gradient(135deg, rgba(56,189,248,.95), rgba(124,58,237,.85)); }

    .label{
      flex:1;
      text-align:right;
      line-height:1.1;
    }
    .label strong{
      display:block;
      font-size:14px;
    }
    .label span{
      display:block;
      font-size:12px;
      opacity:.78;
      font-weight:800;
      margin-top:4px;
    }
  </style>
</head>
<body>
  <div class="stack">
    <button class="btn b1" type="button">
      <div class="label"><strong>Button 1</strong><span>انیمیشن خفن</span></div>
      <div class="ico"><span>⚡</span></div>
      <div class="spark"></div>
    </button>

    <button class="btn b2" type="button">
      <div class="label"><strong>Button 2</strong><span>Hover Gradient</span></div>
      <div class="ico"><span>🌊</span></div>
      <div class="spark"></div>
    </button>

    <button class="btn b3" type="button">
      <div class="label"><strong>Button 3</strong><span>Glow Motion</span></div>
      <div class="ico"><span>✅</span></div>
      <div class="spark"></div>
    </button>

    <button class="btn b4" type="button">
      <div class="label"><strong>Button 4</strong><span>Click Spark</span></div>
      <div class="ico"><span>🔥</span></div>
      <div class="spark"></div>
    </button>

    <button class="btn b5" type="button">
      <div class="label"><strong>Button 5</strong><span>Neon Pulse</span></div>
      <div class="ico"><span>🧠</span></div>
      <div class="spark"></div>
    </button>

    <button class="btn b6" type="button">
      <div class="label"><strong>Button 6</strong><span>Glass Shine</span></div>
      <div class="ico"><span>🧊</span></div>
      <div class="spark"></div>
    </button>

    <button class="btn b7" type="button">
      <div class="label"><strong>Button 7</strong><span>Auto Pop Icon</span></div>
      <div class="ico"><span>🚀</span></div>
      <div class="spark"></div>
    </button>
  </div>
</body>
</html>
