<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Radio Player (Upload + Playlist)</title>
  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:#070A12;
      color:#eaf2ff;
    }
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    .card{
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      background:rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      padding:14px;
    }
    h1{margin:0 0 10px;font-size:20px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
    button{
      border:0;border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer;
      color:#07101b;background:linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85));
      box-shadow:0 18px 55px rgba(56,189,248,.18), inset 0 0 0 1px rgba(255,255,255,.18);
      user-select:none;
    }
    .ghost{background:rgba(255,255,255,.07);color:#eaf2ff;box-shadow:none;border:1px solid rgba(255,255,255,.14)}
    .ok{background:linear-gradient(135deg, rgba(34,197,94,.95), rgba(56,189,248,.85))}
    .danger{background:linear-gradient(135deg, rgba(248,113,113,.95), rgba(124,58,237,.85))}
    .progressWrap{
      width:100%;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.15);
      border-radius:14px;
      padding:10px;
      margin-top:12px;
    }
    .barRow{display:flex;gap:10px;align-items:center}
    input[type="range"]{width:100%}
    .small{font-size:13px;color:rgba(234,242,255,.75)}
    .status{font-weight:1000;opacity:.9;margin-top:6px}
    .list{
      margin-top:14px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    @media(max-width:700px){.list{grid-template-columns:1fr}}
    .track{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.18);
      border-radius:14px;
      padding:10px;
      cursor:pointer;
      transition:.15s;
      min-height:56px;
    }
    .track:hover{transform:translateY(-1px);border-color:rgba(56,189,248,.5)}
    .track .t{font-weight:1000}
    .track .a{opacity:.75;font-size:13px;margin-top:3px}
    .playing{
      outline:2px solid rgba(56,189,248,.55);
      border-color:rgba(56,189,248,.55);
      background:rgba(56,189,248,.08);
    }
    audio{width:100%; margin-top:10px}
    .fileRow{
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;
      margin-top:12px;
    }
    input[type="file"]{
      max-width:100%;
      color:rgba(234,242,255,.9);
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🎧 Radio Player (Random + Upload)</h1>

    <div class="row">
      <button id="btnPrev" class="ghost">⏮️ قبلی</button>
      <a href="index.html" style="position:fixed;top:14px;left:14px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#111;font-weight:900;padding:12px 14px;border-radius:14px;text-decoration:none;box-shadow:0 14px 40px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.12;z-index:9999">برگشت به خانه</a>
      <button id="btnPlay" class="ok">▶️ Play</button>
      <button id="btnNext" class="ghost">⏭️ بعدی</button>
      <button id="btnRandom">🎲 Random</button>
      <button id="btnLoop" class="ghost">🔁 Loop: Off</button>
    </div>

    <div class="fileRow">
      <label class="ghost" style="display:inline-flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer">
        ⬆️ آپلود آهنگ
        <input id="fileInput" type="file" accept="audio/*" multiple style="display:none" />
      </label>
      <span class="small">فرمت‌های رایج: mp3 / wav / ogg. (محلی داخل مرورگر پخش می‌شود)</span>
    </div>

    <div class="progressWrap">
      <div class="barRow">
        <span id="curTime" class="small">00:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" />
        <span id="durTime" class="small">00:00</span>
      </div>
      <div class="status" id="status">منتظر انتخاب آهنگ...</div>
      <audio id="audio" preload="metadata"></audio>
    </div>

    <div class="small" style="margin-top:10px">
      اگر پخش نشد، روی دکمه <b>Play</b> بزن (محدودیت autoplay مرورگر).
    </div>

    <div class="list" id="list"></div>
  </div>
</div>

<script>
  const audio = document.getElementById("audio");
  const listEl = document.getElementById("list");

  const btnPlay = document.getElementById("btnPlay");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnRandom = document.getElementById("btnRandom");
  const btnLoop = document.getElementById("btnLoop");

  const statusEl = document.getElementById("status");
  const seek = document.getElementById("seek");
  const curTimeEl = document.getElementById("curTime");
  const durTimeEl = document.getElementById("durTime");

  const fileInput = document.getElementById("fileInput");

  function escapeHtml(str){
    return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function fmtTime(sec){
    if (!Number.isFinite(sec) || sec < 0) return "00:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }
  function setStatus(msg){ statusEl.textContent = msg; }
  function updatePlayButton(){
    btnPlay.textContent = audio.paused ? "▶️ Play" : "⏸ Pause";
  }

  // --------- پیشفرض: 20 آهنگ نمونه (قابل تغییر) ----------
  // اگر لینک‌ها برای شما باز نشد، فقط لینک‌های mp3 واقعی خودت رو بده تا جایگزین کنم.
  const defaultTracks = [
    { title: "Song 1",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
    { title: "Song 2",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
    { title: "Song 3",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
    { title: "Song 4",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
    { title: "Song 5",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" },
    { title: "Song 6",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" },
    { title: "Song 7",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" },
    { title: "Song 8",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" },
    { title: "Song 9",  artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" },
    { title: "Song 10", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" },
    { title: "Song 11", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3" },
    { title: "Song 12", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3" },
    { title: "Song 13", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3" },
    { title: "Song 14", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3" },
    { title: "Song 15", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" },
    { title: "Song 16", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-16.mp3" },
    { title: "Song 17", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3" },
    { title: "Song 18", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-18.mp3" },
    { title: "Song 19", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-19.mp3" },
    { title: "Song 20", artist: "Radio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-20.mp3" }
  ];

  // --------- State ----------
  // track object: {title, artist, url, isUpload?, fileName?, objectUrl?}
  const tracks = [...defaultTracks];

  let currentIndex = 0;
  let isLoop = false;
  let isPlaying = false;
  let isSeeking = false;

  // برای آپلود: باید objectURLها رو آزاد کنیم تا مموری نره
  const uploadedObjectUrls = new Set();

  // --------- UI ----------
  function renderList(){
    listEl.innerHTML = "";
    tracks.forEach((t, idx) => {
      const div = document.createElement("div");
      div.className = "track" + (idx === currentIndex ? " playing" : "");
      div.dataset.idx = String(idx);
      div.innerHTML = `
        <div class="t">${escapeHtml(t.title)}</div>
        <div class="a">${escapeHtml(t.artist || "—")}</div>
      `;
      div.addEventListener("click", async () => {
        await loadTrack(idx, true);
      });
      listEl.appendChild(div);
    });
  }

  // --------- Player core ----------
  async function tryPlay(){
    try{
      await audio.play();
      return true;
    }catch(e){
      isPlaying = false;
      updatePlayButton();
      setStatus("برای پخش باید روی Play کلیک کنی (اجازه مرورگر).");
      return false;
    }
  }

  async function loadTrack(index, autoplay){
    if (index < 0 || index >= tracks.length) return;
    currentIndex = index;
    renderList();

    const t = tracks[currentIndex];
    setStatus("در حال آماده‌سازی: " + t.title + " — " + (t.artist || "—"));

    // تنظیم src با pause مطمئن
    audio.pause();
    audio.removeAttribute("src");
    audio.load();

    audio.src = t.url;
    audio.currentTime = 0;
    isPlaying = false;
    updatePlayButton();

    if (autoplay){
      await new Promise(r => setTimeout(r, 20));
      await tryPlay();
    } else {
      setStatus("لود شد: " + t.title + " — برای پخش ▶️ بزن");
    }
  }

  async function nextTrack(){
    if (!tracks.length) return;
    if (isLoop){
      audio.currentTime = 0;
      await tryPlay();
      setStatus("Loop: همین آهنگ دوباره از اول");
      return;
    }
    const next = (currentIndex + 1) % tracks.length;
    await loadTrack(next, isPlaying);
    if (!isPlaying) setStatus("لود شد: " + tracks[next].title + " — برای پخش ▶️ بزن");
  }

  async function prevTrack(){
    if (!tracks.length) return;
    if (isLoop){
      audio.currentTime = 0;
      await tryPlay();
      setStatus("Loop: همین آهنگ دوباره از اول");
      return;
    }
    const prev = (currentIndex - 1 + tracks.length) % tracks.length;
    await loadTrack(prev, isPlaying);
    if (!isPlaying) setStatus("لود شد: " + tracks[prev].title + " — برای پخش ▶️ بزن");
  }

  async function playPause(){
    if (!audio.src){
      await loadTrack(currentIndex, true);
      return;
    }
    if (audio.paused){
      await tryPlay();
    } else {
      audio.pause();
    }
  }

  function randomPick(){
    if (tracks.length < 2) return currentIndex;
    let idx = Math.floor(Math.random() * tracks.length);
    if (idx === currentIndex) idx = (idx + 1) % tracks.length;
    return idx;
  }

  // --------- Events UI ----------
  btnPlay.addEventListener("click", playPause);
  btnPrev.addEventListener("click", prevTrack);
  btnNext.addEventListener("click", nextTrack);

  btnRandom.addEventListener("click", async () => {
    if (!tracks.length) return;
    const idx = randomPick();
    await loadTrack(idx, true);
  });

  btnLoop.addEventListener("click", () => {
    isLoop = !isLoop;
    btnLoop.textContent = `🔁 Loop: ${isLoop ? "On" : "Off"}`;
    setStatus(isLoop ? "Loop فعال شد" : "Loop خاموش شد");
  });

  // --------- Seek ----------
  seek.addEventListener("input", () => { isSeeking = true; });
  seek.addEventListener("change", () => {
    if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
    const target = (Number(seek.value) / 1000) * audio.duration;
    audio.currentTime = target;
    isSeeking = false;
  });

  // --------- Audio events ----------
  audio.addEventListener("loadedmetadata", () => {
    durTimeEl.textContent = fmtTime(audio.duration);
  });

  audio.addEventListener("timeupdate", () => {
    if (isSeeking) return;
    curTimeEl.textContent = fmtTime(audio.currentTime);
    if (Number.isFinite(audio.duration) && audio.duration > 0){
      seek.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
    }
  });

  audio.addEventListener("play", () => {
    isPlaying = true;
    updatePlayButton();
    const t = tracks[currentIndex];
    setStatus("در حال پخش: " + t.title + " — " + (t.artist || "—"));
  });

  audio.addEventListener("pause", () => {
    isPlaying = false;
    updatePlayButton();
    if (audio.currentTime > 0) setStatus("Pause");
    else setStatus("آماده‌ست");
  });

  audio.addEventListener("ended", () => nextTrack());

  audio.addEventListener("error", () => {
    isPlaying = false;
    updatePlayButton();
    setStatus("خطا در پخش آهنگ. ممکن است لینک خراب باشد یا فرمت پشتیبانی نشود.");
  });

  // --------- Upload ----------
  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;

    // فقط آهنگ‌های معتبر
    const audioFiles = files.filter(f => f.type.startsWith("audio/"));
    if (!audioFiles.length){
      alert("فایل صوتی انتخاب نشده!");
      return;
    }

    setStatus("در حال آپلود/آماده‌سازی فایل‌ها...");
    let added = 0;

    for (const f of audioFiles){
      const objectUrl = URL.createObjectURL(f);
      uploadedObjectUrls.add(objectUrl);

      tracks.push({
        title: f.name.replace(/\.[^/.]+$/, ""),
        artist: "Uploaded",
        url: objectUrl,
        isUpload: true,
        objectUrl
      });
      added++;
    }

    // رندر و پخش آهنگ آخر آپلود شده
    renderList();
    setStatus(`${added} آهنگ اضافه شد. در حال پخش آهنگ آخر...`);
    const lastIndex = tracks.length - 1;
    await loadTrack(lastIndex, true);

    // پاک کردن ورودی برای اینکه آپلود تکراری هم درست کار کنه
    fileInput.value = "";
  });

  // آزادسازی مموری objectURLها
  window.addEventListener("beforeunload", () => {
    for (const u of uploadedObjectUrls){
      try{ URL.revokeObjectURL(u); }catch{}
    }
    uploadedObjectUrls.clear();
  });

  // Init
  renderList();
  loadTrack(0, false);
</script>
</body>
</html>
