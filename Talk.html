<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Voice Room - Fix</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b1220;color:#e5e7eb;display:flex;justify-content:center;padding:24px}
    .app{width:min(900px,100%)}
    .card{background:#0f1a2f;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden}
    header{padding:14px 16px;background:linear-gradient(90deg, rgba(99,102,241,.25), rgba(34,211,238,.15));border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;gap:12px}
    .title{font-weight:900}
    .pill{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.15);color:#c7d2fe;background:rgba(99,102,241,.08);white-space:nowrap}
    .content{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .panel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px}
    label{display:block;font-size:12px;color:#b6c2d9;margin-bottom:8px}
    input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0b1220;color:#e5e7eb;outline:none}
    input:focus{border-color:rgba(99,102,241,.65);box-shadow:0 0 0 4px rgba(99,102,241,.18)}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    button{border:0;cursor:pointer;border-radius:12px;padding:11px 14px;font-weight:900;background:#4f46e5;color:#fff;transition:transform .05s ease,filter .15s ease}
    button.secondary{background:#1f2a44;border:1px solid rgba(255,255,255,.12)}
    button.danger{background:#dc2626}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:10px;font-size:13px;color:#cbd5e1;line-height:1.7;min-height:44px}
    .chat{height:360px;overflow:auto;padding:12px;background:#0b1220;border:1px solid rgba(255,255,255,.08);border-radius:14px}
    .msg{margin:10px 0;display:flex}
    .msg.user{justify-content:flex-start}
    .msg.bot{justify-content:flex-end}
    .bubble{max-width:85%;padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);white-space:pre-wrap;word-wrap:break-word;line-height:1.6;font-size:14px}
    .msg.user .bubble{background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.35)}
    .msg.bot .bubble{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.28)}
    .small{font-size:12px;color:#94a3b8;line-height:1.7}
    .log{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:12px;color:#93c5fd;background:#050a14;border:1px solid rgba(255,255,255,.06);padding:10px;border-radius:12px;margin-top:10px;max-height:120px;overflow:auto;white-space:pre-wrap}
  </style>
</head>
<body>
<div class="app">
  <div class="card">
    <header>
      <div class="title">Voice Room (رفع خطای شروع)</div>
      <div class="pill" id="envPill">—</div>
    </header>

    <div class="content">
      <div class="panel">
        <label>نام روم</label>
        <input id="roomInput" value="demo-1" autocomplete="off"/>

        <div class="row">
          <button id="createBtn">ساخت روم</button>
          <a href="index.html" style="position:fixed;top:14px;left:14px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#111;font-weight:900;padding:12px 14px;border-radius:14px;text-decoration:none;box-shadow:0 14px 40px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.12;z-index:9999">برگشت به خانه</a>
          <button id="joinBtn" class="secondary">ورود به روم</button>
        </div>

        <div class="status" id="statusText">ابتدا روم بساز یا وارد شو.</div>

        <div class="row">
          <button id="micBtn" class="secondary" disabled>شروع حرف زدن</button>
          <button id="stopBtn" class="danger" disabled>قطع</button>
          <button id="leaveBtn" class="secondary" disabled>خروج</button>
        </div>

        <div class="small" style="margin-top:10px">
          نکته: برای میکروفن باید روی <b>HTTPS</b> یا <b>localhost</b> اجرا کنی، نه file://
        </div>

        <div class="log" id="logEl"></div>
      </div>

      <div class="panel">
        <div class="chat" id="chatEl" aria-live="polite"></div>
        <div class="row" style="margin-top:12px;">
          <button id="clearBtn" class="secondary">پاک کردن چت</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const chatEl = $("chatEl");
  const logEl = $("logEl");

  let room = null;
  let channel = null;
  const localId = Math.random().toString(16).slice(2);

  let recognition = null;
  let listening = false;
  let startedOnce = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canSTT = !!SpeechRecognition;
  const canTTS = "speechSynthesis" in window;

  $("envPill").textContent = (canSTT ? "STT ✅" : "STT ❌") + " | " + (canTTS ? "TTS ✅" : "TTS ❌");

  function log(msg){
    const t = new Date().toLocaleTimeString("fa-IR");
    logEl.textContent += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(msg){ $("statusText").textContent = msg; }

  function addMsg(text, role){
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function speak(text){
    if(!canTTS) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fa-IR";
      u.rate = 1;
      speechSynthesis.speak(u);
    }catch(e){
      log("TTS error: " + e.message);
    }
  }

  function botReply(userText){
    const t = (userText || "").trim().toLowerCase();
    if(t.includes("سلام") || t.includes("درود")) return "سلام دوست عزیزم";
    if(t.includes("خوبی") || t.includes("چطوری") || t.includes("حالت")) {
      return "بله من خوب هستم شما چطور اگر کمکی نیاز دارید من در خدمتم";
    }
    return "حتماً! بگو دقیقاً چه کمکی نیاز داری؟";
  }

  function sendChat(text, role){
    addMsg(text, role);
    if(channel){
      channel.postMessage({ type:"chat", room, from: localId, payload:{text, role} });
    }
  }

  function setupChannel(){
    if(channel) { try{ channel.close(); }catch{} }
    channel = new BroadcastChannel(`voice-room:${room}`);
    channel.onmessage = (e) => {
      const msg = e.data;
      if(!msg || msg.room !== room) return;
      if(msg.from === localId) return;

      if(msg.type === "chat"){
        addMsg(msg.payload.text, msg.payload.role);
        if(msg.payload.role === "bot") speak(msg.payload.text);
      }
    };
  }

  function setUIInRoom(inRoom){
    $("leaveBtn").disabled = !inRoom;
    $("micBtn").disabled = !inRoom;
    $("stopBtn").disabled = true;
  }

  function enterRoom(action){
    room = ($("roomInput").value.trim() || "demo-1");
    setupChannel();
    setUIInRoom(true);
    setStatus(action === "create" ? "روم ساخته شد. حالا شروع حرف زدن را بزن." : "وارد شدی. حالا شروع حرف زدن را بزن.");
    log(`Entered room "${room}" as ${action}`);
    sendChat("سلام دوست عزیزم", "bot");
  }

  function leaveRoom(){
    try{ if(recognition) recognition.stop(); }catch{}
    listening = false;

    try{ if(channel) channel.close(); }catch{}
    channel = null;
    room = null;

    $("micBtn").disabled = true;
    $("stopBtn").disabled = true;
    $("leaveBtn").disabled = true;

    setStatus("ابتدا روم بساز یا وارد شو.");
    log("Left room.");
  }

  function stopSTT(){
    try{
      if(recognition) recognition.stop();
    }catch{}
    listening = false;
    $("stopBtn").disabled = true;
    $("micBtn").disabled = false;
    setStatus("قطع شد.");
  }

  async function startSTT(){
    if(!room){
      setStatus("اول روم بساز یا وارد شو.");
      return;
    }
    if(!canSTT){
      setStatus("SpeechRecognition در این مرورگر پشتیبانی نمی‌شود.");
      return;
    }
    if(listening){
      setStatus("الان در حال گوش دادن هستم.");
      return;
    }

    // مهم: بعضی مرورگرها اگر چندبار سریع start شود خطا می‌دهند
    listening = true;
    startedOnce = true;

    recognition = new SpeechRecognition();
    recognition.lang = "fa-IR";
    recognition.interimResults = true;
    recognition.continuous = true;

    recognition.onstart = () => {
      $("micBtn").disabled = true;
      $("stopBtn").disabled = false;
      setStatus("در حال گوش دادن… حرف بزن.");
      log("STT started.");
    };

    recognition.onerror = (e) => {
      log("STT error: " + (e.error || "unknown"));
      // برای اینکه UI گیر نکند:
      listening = false;
      $("micBtn").disabled = false;
      $("stopBtn").disabled = true;

      const err = e.error || "نامشخص";
      // پیام واضح برای کاربر
      if(err === "not-allowed" || err === "service-not-allowed"){
        setStatus("اجازه میکروفن داده نشده. لطفاً اجازه میکروفن را در مرورگر فعال کن.");
      } else if(err === "network"){
        setStatus("مشکل شبکه/سرویس تشخیص گفتار. VPN/Network را بررسی کن.");
      } else {
        setStatus("خطای SpeechRecognition: " + err);
      }
    };

    recognition.onend = () => {
      listening = false;
      $("micBtn").disabled = false;
      $("stopBtn").disabled = true;
      setStatus("STT متوقف شد. اگر خواستی دوباره شروع کن.");
      log("STT ended.");
    };

    recognition.onresult = (event) => {
      let finalText = "";
      for(let i = event.resultIndex; i < event.results.length; i++){
        const res = event.results[i];
        if(res.isFinal){
          finalText += res[0]?.transcript || "";
        }
      }
      finalText = finalText.trim();
      if(finalText){
        sendChat(finalText, "user");
        const reply = botReply(finalText);
        sendChat(reply, "bot");
      }
    };

    // try/catch برای خطای start (همان چیزی که شما گفتی “ارور میده”)
    try{
      recognition.start();
    }catch(e){
      listening = false;
      $("micBtn").disabled = false;
      $("stopBtn").disabled = true;
      setStatus("خطا هنگام شروع گفتار: " + e.message);
      log("start() exception: " + e.message);
    }
  }

  // Events
  $("createBtn").addEventListener("click", () => enterRoom("create"));
  $("joinBtn").addEventListener("click", () => enterRoom("join"));
  $("leaveBtn").addEventListener("click", leaveRoom);

  $("micBtn").addEventListener("click", () => {
    startSTT();
  });

  $("stopBtn").addEventListener("click", () => {
    stopSTT();
  });

  $("clearBtn").addEventListener("click", () => {
    chatEl.innerHTML = "";
    log("Chat cleared.");
  });

  // initial UI
  setUIInRoom(false);
  setStatus((canSTT ? "" : "STT پشتیبانی نمی‌شود. ") + "ابتدا روم بساز یا وارد شو.");
  log("Loaded.");
})();
</script>
</body>
</html>
