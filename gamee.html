<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Cartoon Runner - NPC Dialogue</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background:#070a14; touch-action:none; }
    canvas { width:100%; height:100%; display:block; }
    #toast{
      position:fixed; left:12px; top:12px;
      background: rgba(124,92,255,.18);
      border: 1px solid rgba(124,92,255,.35);
      color:#eaf0ff;
      padding:10px 12px;
      border-radius:14px;
      font-weight:900;
      font-size:16px;
      max-width: calc(100vw - 24px);
      line-height:1.5;
      pointer-events:none;
      opacity:0;
      transform: translateY(-8px);
      transition: opacity .18s ease, transform .18s ease;
      z-index:10;
    }
    #toast.show{ opacity:1; transform: translateY(0); }

    .ui{
      position:fixed; left:0; right:0; bottom:14px;
      display:flex; justify-content:center; gap:12px; padding:0 12px;
      pointer-events:none;
      z-index:10;
    }
    .btn{
      pointer-events:auto;
      width:130px; height:74px;
      border-radius:18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      color:#eaf0ff;
      font-weight:900; font-size:18px;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      user-select:none; -webkit-user-select:none;
      touch-action:none;
    }
    .btn:active{ transform: scale(.98); }
    .hint{
      position:fixed; top:92px; left:12px;
      color: rgba(234,240,255,.75);
      font-weight:800; font-size:12px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      padding:8px 10px; border-radius:12px;
      pointer-events:none;
      z-index:10;
      max-width: calc(100vw - 24px);
      line-height:1.7;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="toast">سلام</div>
  <div class="hint">راه رفتن: نگه دار جلو/عقب • پرش: تپ</div>

  <div class="ui">
    <button class="btn" id="btnBack">عقب</button>
    <button class="btn" id="btnJump">پرش</button>
    <button class="btn" id="btnForward">جلو</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const btnForward = document.getElementById('btnForward');
  const btnBack = document.getElementById('btnBack');
  const btnJump = document.getElementById('btnJump');
  const toast = document.getElementById('toast');

  let W=0,H=0,dpr=1;
  function resize(){
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const groundY = () => Math.floor(H*0.78);

  // جهان بی‌نهایت (فقط برای NPCها و حرکت)
  const world = {
    camX: 0,
    playerXWorld: 0,
    npc: null, // فقط یک نفر در هر لحظه
    npcState: 'waiting', // waiting -> greeted -> passed -> spawning
    nextNpcWorldX: 520
  };

  const player = {
    x: 0, // world
    y: 0,
    w: 44, h: 70,
    vy: 0,
    onGround: false,
    speed: 210,
    jumpV: -520,
    gravity: 1350,
    faceDir: 1,
    stepT: 0
  };

  function resetPlayer(){
    player.x = 140;
    player.y = groundY() - player.h;
    player.vy = 0;
    player.onGround = true;
    player.faceDir = 1;
    player.stepT = 0;
  }
  resetPlayer();

  let moveDir = 0; // -1 عقب، +1 جلو
  function bindHold(btn, dir){
    btn.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      btn.setPointerCapture?.(e.pointerId);
      moveDir = dir;
    }, {passive:false});
    btn.addEventListener('pointerup', (e)=>{
      e.preventDefault();
      moveDir = 0;
    }, {passive:false});
    btn.addEventListener('pointercancel', ()=>{
      moveDir = 0;
    }, {passive:false});
  }
  bindHold(btnForward, +1);
  bindHold(btnBack, -1);

  btnJump.addEventListener('click', (e)=>{
    e.preventDefault();
    if(player.onGround){
      player.vy = player.jumpV;
      player.onGround = false;
    }
  });

  function showToast(msg, ms=1100){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), ms);
  }

  function spawnNextNpc(){
    // فقط یک نفر: بعد از رد شدن، یکی جدید میاد
    const x = world.nextNpcWorldX;
    world.npc = {
      x,
      greeted: false,
      dir: 1,
      colorAlt: Math.random()<.5,
      // state داخلی برای “رفتن جلو”
      passed: false,
      // برای تاخیر پیام‌ها
      timer: 0
    };
    world.npcState = 'waiting';
    // فاصله تا NPC بعدی
    world.nextNpcWorldX = x + 520 + Math.random()*120;
  }

  // شروع: یک NPC اول
  spawnNextNpc();

  // --- draw utils
  function roundRect(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawBackground(t){
    ctx.clearRect(0,0,W,H);

    // آسمان
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#070a14');
    g.addColorStop(1,'#0d1533');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // زمین نئون
    const gy = groundY();
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(0, gy, W, H-gy);

    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = 'rgba(124,92,255,.9)';
    ctx.lineWidth = 2;

    const cam = world.camX;
    for(let i=0;i<10;i++){
      const y = gy - 130 - i*26;
      const wave = Math.sin(t*0.002 + i + cam*0.004)*6;
      ctx.beginPath();
      ctx.moveTo(-20 - (cam%60), y + wave);
      ctx.lineTo(W+20 - (cam%60), y + wave);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // خط زمین
    ctx.strokeStyle = 'rgba(25,211,255,.55)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();

    // سایه
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    const pxScreen = player.x - world.camX + player.w/2;
    ctx.ellipse(pxScreen, gy+6, 18, 8, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawCartoon(xScreen, y, dir=1, tintA, tintB, wink=false){
    const w = player.w, h = player.h;

    ctx.save();
    if(dir === -1){
      ctx.translate(xScreen + w/2, 0);
      ctx.scale(-1,1);
      ctx.translate(-(xScreen + w/2), 0);
    }

    const gy = groundY();

    // head
    ctx.shadowColor = 'rgba(124,92,255,.7)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(234,240,255,.92)';
    ctx.beginPath();
    ctx.arc(xScreen + w/2, y - 10, 18, 0, Math.PI*2);
    ctx.fill();

    // eyes
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#070a14';
    ctx.beginPath();
    ctx.arc(xScreen + w/2 - 6, y - 14, 2.4, 0, Math.PI*2);
    ctx.fill();
    if(wink){
      ctx.strokeStyle = '#070a14';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(xScreen + w/2 + 1.5, y - 14);
      ctx.lineTo(xScreen + w/2 + 7, y - 14);
      ctx.stroke();
    }else{
      ctx.beginPath();
      ctx.arc(xScreen + w/2 + 6, y - 14, 2.4, 0, Math.PI*2);
      ctx.fill();
    }

    // body
    ctx.fillStyle = tintA;
    ctx.strokeStyle = tintB;
    ctx.lineWidth = 3;
    roundRect(xScreen + 10, y + 10, w - 20, 40, 14);
    ctx.fill(); ctx.stroke();

    // arms
    const arm = Math.sin(player.stepT*1.7)*6;
    ctx.strokeStyle = 'rgba(234,240,255,.85)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(xScreen + 14, y + 24);
    ctx.lineTo(xScreen + 18 + (dir===1?arm:-arm), y + 18);
    ctx.stroke();

    // legs
    const leg = Math.sin(player.stepT*1.9)*5;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(xScreen + 18, gy - 30);
    ctx.lineTo(xScreen + 10 + (dir===1?-leg:leg), gy - 10);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(xScreen + w - 18, gy - 30);
    ctx.lineTo(xScreen + w - 10 + (dir===1?leg:-leg), gy - 10);
    ctx.stroke();

    // shoes
    ctx.fillStyle = 'rgba(255,77,109,.75)';
    ctx.shadowColor = 'rgba(255,77,109,.55)';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.roundRect(xScreen + 10, gy - 12, 18, 10, 6);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(xScreen + w - 28, gy - 12, 18, 10, 6);
    ctx.fill();

    ctx.restore();
  }

  function updateLogic(dt){
    // move player in world
    player.faceDir = (moveDir !== 0) ? moveDir : player.faceDir;
    const vx = moveDir * player.speed;

    player.x += vx * dt;

    // clamp: فعلاً فقط نگه‌دار که از پشت نیفته/بیرون نره (کادر جدید با NPC فقط جلو میاد)
    player.x = Math.max(30, player.x);

    // gravity
    if(!player.onGround){
      player.vy += player.gravity * dt;
      player.y += player.vy * dt;
    }

    // ground collision
    const gy = groundY();
    const floorY = gy - player.h;
    if(player.y >= floorY){
      player.y = floorY;
      player.vy = 0;
      player.onGround = true;
    }

    // camera follow (player)
    const targetCam = player.x - (W*0.25);
    world.camX += (targetCam - world.camX) * Math.min(1, dt*8);

    // npc logic (یک نفر در هر لحظه)
    if(world.npc){
      const npc = world.npc;
      // اگر پلیر به NPC نزدیک شد، سلام یک بار
      const npcScreenX = npc.x - world.camX;
      const playerScreenX = player.x - world.camX;

      const passedNow = (playerScreenX > npcScreenX + 35); // رد شدن از جلوی NPC

      if(world.npcState === 'waiting'){
        if(!npc.greeted && Math.abs((playerScreenX+22) - (npcScreenX+22)) < 70){
          npc.greeted = true;
          world.npcState = 'greeted';
          showToast('سلام', 900);
        }
      } else if(world.npcState === 'greeted'){
        // وقتی رد شد، پیام اصلی را بده و NPC “برود جلو”
        if(passedNow){
          world.npcState = 'passed';
          showToast('خوب دوست من خوش آمدی به چالش سنگین و خفن برو جلو تر', 1400);
          // “رفتن جلو”: همینجا NPC رو از صفحه رد می‌کنیم (x را جلوتر می‌بریم)
          npc.passed = true;
          npc.x += 1200;
        }
      } else if(world.npcState === 'passed'){
        // بعد از اینکه NPC از محدوده دور شد، یکی جدید spawn شود
        if(npc.x - world.camX > W + 300){
          spawnNextNpc();
        }
      }
    }

    // animation
    const moving = (moveDir !== 0) && player.onGround;
    player.stepT += (moving ? 1 : 0.3) * (1.0);
  }

  function drawLogic(t){
    drawBackground(t);

    // npc draw (فقط یکی)
    if(world.npc){
      const npc = world.npc;
      const xScreen = npc.x - world.camX;

      if(xScreen > -120 && xScreen < W+120){
        const gy = groundY();
        drawCartoon(
          xScreen - 22,
          gy - player.h,
          1,
          npc.colorAlt ? 'rgba(124,92,255,.55)' : 'rgba(25,211,255,.40)',
          npc.colorAlt ? 'rgba(25,211,255,.70)' : 'rgba(124,92,255,.75)',
          false
        );
      }
    }

    // player draw
    const pxScreen = player.x - world.camX;
    const bob = player.onGround ? Math.sin(player.stepT*0.14)*3 : 0;
    drawCartoon(pxScreen, player.y + bob, player.faceDir, 'rgba(124,92,255,.55)', 'rgba(25,211,255,.70)', false);
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;
    updateLogic(dt);
    drawLogic(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
