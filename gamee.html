<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, user-scalable=no" />
  <title>Game - Shoot & DID</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background:#070a14; touch-action:none; }
    canvas { width:100%; height:100%; display:block; }

    .ui{
      position:fixed; left:0; right:0; bottom:14px;
      display:flex; justify-content:center; gap:12px; padding:0 12px;
      pointer-events:none; z-index:10;
    }
    .btn{
      pointer-events:auto;
      width:130px; height:74px;
      border-radius:18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.18);
      color:#eaf0ff;
      font-weight:900; font-size:18px;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      user-select:none; -webkit-user-select:none;
      touch-action:none;
    }
    .btn:active{ transform: scale(.98); }
    .btn.small{ width:110px; height:64px; font-size:16px; }

    #toast{
      position:fixed; left:12px; top:12px;
      background: rgba(124,92,255,.18);
      border: 1px solid rgba(124,92,255,.35);
      color:#eaf0ff;
      padding:10px 12px;
      border-radius:14px;
      font-weight:900; font-size:16px;
      max-width: calc(100vw - 24px);
      line-height:1.5;
      pointer-events:none;
      opacity:0; transform: translateY(-8px);
      transition: opacity .18s ease, transform .18s ease;
      z-index:10;
    }
    #toast.show{ opacity:1; transform: translateY(0); }

    .hint{
      position:fixed; top:92px; left:12px;
      color: rgba(234,240,255,.75);
      font-weight:800; font-size:12px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      padding:8px 10px; border-radius:12px;
      pointer-events:none; z-index:10;
      max-width: calc(100vw - 24px);
      line-height:1.7;
    }

    #overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center; justify-content:center;
      z-index:50;
      padding:18px;
      pointer-events:auto;
    }
    #overlay.show{ display:flex; }
    .card{
      width:min(560px, 96vw);
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.18);
      border-radius:18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 30px 120px rgba(0,0,0,.65);
      padding:16px;
      text-align:center;
    }
    .card h2{
      margin:0 0 10px;
      font-size:20px;
      color:#eaf0ff;
      letter-spacing:.2px;
    }
    .menuText{
      color: rgba(234,240,255,.85);
      font-weight:900;
      margin-bottom:12px;
      line-height:1.7;
      text-align:center;
    }
    .optList{ display:flex; flex-direction:column; gap:10px; }
    .opt{
      border-radius:14px;
      padding:12px 12px;
      font-weight:900;
      font-size:17px;
      color:#eaf0ff;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.16);
      cursor:pointer;
      user-select:none;
      text-align:center;
    }
    .opt:active{ transform: scale(.99); }

    #result{
      display:none;
      align-items:center; justify-content:center;
      position:fixed; inset:0;
      background: rgba(0,0,0,.60);
      z-index:60;
      padding:18px;
      pointer-events:auto;
    }
    #result.show{ display:flex; }
    .resultCard{
      width:min(560px, 96vw);
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.18);
      border-radius:18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 30px 120px rgba(0,0,0,.65);
      padding:16px;
      text-align:center;
    }
    .did{
      font-size:54px;
      font-weight:1200;
      color:#eaf0ff;
      margin:8px 0 4px;
      letter-spacing:2px;
    }
    .subtxt{
      color: rgba(234,240,255,.75);
      font-weight:900;
      font-size:15px;
      line-height:1.8;
      margin:0 0 14px;
    }
    #restart{
      width:240px; height:66px;
      border-radius:18px;
      border:0;
      font-weight:1000;
      font-size:18px;
      color:#071018;
      background: linear-gradient(135deg, #7c5cff, #19d3ff);
      box-shadow:0 18px 55px rgba(124,92,255,.30);
      cursor:pointer;
      user-select:none;
    }
    #restart:active{ transform: scale(.98); }

    #shootWrap{
      position:fixed; left:12px; top:12px;
      z-index:20;
      display:none;
      pointer-events:none;
    }
    #shootBar{
      pointer-events:none;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      color:#eaf0ff;
      font-weight:1000;
      padding:10px 12px;
      border-radius:14px;
      white-space:nowrap;
    }
    #shootAmmo{ color:#aefcff; }
    #shootBtnRow{
      margin-top:10px;
      display:flex;
      gap:10px;
      justify-content:flex-start;
      pointer-events:auto;
    }
    #btnShoot{
      width:160px; height:64px;
      border-radius:18px;
      border:0;
      background: linear-gradient(135deg, #7c5cff, #19d3ff);
      box-shadow:0 18px 55px rgba(124,92,255,.30);
      color:#071018;
      font-weight:1100;
      font-size:18px;
      cursor:pointer;
      user-select:none;
      touch-action:none;
    }
    #btnShoot:active{ transform: scale(.98); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="toast">سلام</div>
  <div class="hint">راه رفتن: نگه دار جلو/عقب • پرش: تپ</div>

  <div class="ui">
    <button class="btn small" id="btnBack">عقب</button>
    <button class="btn" id="btnJump">پرش</button>
    <button class="btn small" id="btnForward">جلو</button>
  </div>

  <div id="shootWrap">
    <div id="shootBar">تیر: <span id="shootAmmo">20</span></div>
    <div id="shootBtnRow">
      <button id="btnShoot">شوت</button>
    </div>
  </div>

  <div id="overlay">
    <div class="card">
      <h2 id="menuTitle">انتخاب کن</h2>
      <div class="menuText" id="menuText"></div>
      <div class="optList" id="optList"></div>
    </div>
  </div>

  <div id="result">
    <div class="resultCard">
      <div class="did" id="didText">DID</div>
      <div class="subtxt" id="resultSub">...</div>
      <button id="restart">بازی مجدد</button>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const btnForward = document.getElementById('btnForward');
  const btnBack = document.getElementById('btnBack');
  const btnJump = document.getElementById('btnJump');

  const toast = document.getElementById('toast');
  const overlay = document.getElementById('overlay');
  const menuTitle = document.getElementById('menuTitle');
  const menuText = document.getElementById('menuText');
  const optList = document.getElementById('optList');

  const result = document.getElementById('result');
  const resultSub = document.getElementById('resultSub');
  const restartBtn = document.getElementById('restart');

  const shootWrap = document.getElementById('shootWrap');
  const shootAmmoEl = document.getElementById('shootAmmo');
  const btnShoot = document.getElementById('btnShoot');

  let W=0,H=0,dpr=1;
  function resize(){
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const groundY = () => Math.floor(H*0.78);

  const player = {
    x: 140,
    y: groundY() - 70,
    w: 44, h: 70,
    vy: 0,
    onGround: true,
    speed: 210,
    jumpV: -520,
    gravity: 1350,
    faceDir: 1,
    stepT: 0,
    stepFrozen: false
  };

  const npc = { active:false, x: 560, greeted:false };

  const target = {
    active:false,
    x: 1000,
    speed: 140,
    alive:false,
    hit:false
  };

  const S = {
    camX: 0,

    stage: 0, // 0: npc question , 1: shoot
    overlayOpen:false,
    didShowing:false,

    npcQuestionOpened:false, // برای جلوگیری از تکرار سوال

    // shoot
    showGun:false,
    shootMode:false,
    ammo: 20,

    transitionLock:false,

    shootTimeLimit: 20,
    shootTimer: 0,
    didAllowed: false,

    // ✅ وقتی موفق میشیم، تا ریست کامل انجام نشده منطق‌های دیگر اجرا نشه
    victoryLock:false
  };

  let moveDir = 0;

  function showToast(msg, ms=900){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), ms);
  }

  function setOverlay(open, title='', text='', options=[]){
    S.overlayOpen = open;
    overlay.classList.toggle('show', open);
    if(!open) return;

    menuTitle.textContent = title;
    menuText.textContent = text || '';
    optList.innerHTML = '';

    let locked = false;
    options.forEach(opt=>{
      const d = document.createElement('div');
      d.className = 'opt';
      d.textContent = opt.label;
      d.onclick = ()=>{
        if(locked) return;
        locked = true;
        opt.onClick?.();
      };
      optList.appendChild(d);
    });
  }

  function clearResult(){
    S.didShowing = false;
    result.classList.remove('show');
  }

  function setResult(subText){
    S.didShowing = true;
    resultSub.textContent = subText;
    result.classList.add('show');
  }

  function roundRect(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawCartoon(xScreen, y, dir=1, opts={}){
    const w = player.w, h = player.h;
    ctx.save();

    if(dir === -1){
      ctx.translate(xScreen + w/2, 0);
      ctx.scale(-1,1);
      ctx.translate(-(xScreen + w/2), 0);
    }

    const gy = groundY();

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(xScreen + w/2, gy + 6, 18, 8, 0, 0, Math.PI*2);
    ctx.fill();

    // head
    ctx.fillStyle = 'rgba(234,240,255,.92)';
    ctx.beginPath();
    ctx.arc(xScreen + w/2, y - 10, 18, 0, Math.PI*2);
    ctx.fill();

    // eyes
    ctx.fillStyle = '#070a14';
    const eyeY = y - 14;
    ctx.beginPath(); ctx.arc(xScreen + w/2 - 6, eyeY, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(xScreen + w/2 + 6, eyeY, 2.4, 0, Math.PI*2); ctx.fill();

    // body
    ctx.fillStyle = 'rgba(124,92,255,.55)';
    ctx.strokeStyle = 'rgba(25,211,255,.70)';
    ctx.lineWidth = 3;
    roundRect(xScreen + 10, y + 10, w - 20, 40, 14);
    ctx.fill(); ctx.stroke();

    // limbs
    const frozen = player.stepFrozen || S.didShowing || S.overlayOpen || S.victoryLock;
    const stepT = frozen ? 0 : player.stepT;
    const arm = Math.sin(stepT*1.7)*6;
    const leg = Math.sin(stepT*1.9)*5;

    ctx.strokeStyle = 'rgba(234,240,255,.85)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(xScreen + 14, y + 24);
    ctx.lineTo(xScreen + 18 + (dir===1?arm:-arm), y + 18);
    ctx.stroke();

    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(234,240,255,.85)';
    ctx.beginPath();
    ctx.moveTo(xScreen + 18, gy - 30);
    ctx.lineTo(xScreen + 10 + (dir===1?-leg:leg), gy - 10);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(xScreen + w - 18, gy - 30);
    ctx.lineTo(xScreen + w - 10 + (dir===1?leg:-leg), gy - 10);
    ctx.stroke();

    // shoes
    ctx.fillStyle = 'rgba(255,77,109,.75)';
    ctx.beginPath(); ctx.roundRect(xScreen + 10, gy - 12, 18, 10, 6); ctx.fill();
    ctx.beginPath(); ctx.roundRect(xScreen + w - 28, gy - 12, 18, 10, 6); ctx.fill();

    // gun (cartoon) - نمایشی
    if(opts.showGun){
      ctx.strokeStyle = 'rgba(234,240,255,.95)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';

      const kx = xScreen + (dir===1 ? w-8 : 8);
      const ky = y + 22;

      ctx.shadowBlur = 18;
      ctx.shadowColor = 'rgba(25,211,255,.65)';
      ctx.beginPath();
      ctx.moveTo(kx, ky);
      ctx.lineTo(kx + (dir===1 ? 24 : -24), ky - 10);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(124,92,255,.65)';
      ctx.beginPath();
      ctx.roundRect(kx + (dir===1 ? 8 : -8) - 6, ky - 2, 12, 10, 4);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawNPC(){
    if(!npc.active) return;
    const xScreen = npc.x - S.camX;
    const gy = groundY();
    drawCartoon(xScreen - 18, gy - player.h, 1, {});
  }

  function drawBackground(t){
    ctx.clearRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#070a14');
    g.addColorStop(1,'#0d1533');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    const gy = groundY();
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(0, gy, W, H-gy);

    ctx.strokeStyle = 'rgba(25,211,255,.55)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();

    // waves
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = 'rgba(124,92,255,.9)';
    ctx.lineWidth = 2;
    const cam = S.camX;
    for(let i=0;i<10;i++){
      const y = gy - 130 - i*26;
      const wave = Math.sin(t*0.002 + i + cam*0.004)*6;
      ctx.beginPath();
      ctx.moveTo(-20 - (cam%60), y + wave);
      ctx.lineTo(W+20 - (cam%60), y + wave);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function spawnNpc(){
    npc.active = true;
    npc.x = 560;
    npc.greeted = false;
    S.npcQuestionOpened = false;
  }

  function spawnTarget(){
    target.active = true;
    target.alive = true;
    target.hit = false;
    target.x = 1000; // ✅ دور شروع میشه که ۲۰ ثانیه وقت باشه
  }

  function resetAll(){
    S.victoryLock = false;
    S.transitionLock = false;

    setResult(''); // not shown; just to ensure didShowing false? we'll clear:
    clearResult();

    overlay.classList.remove('show');
    S.overlayOpen = false;

    S.stage = 0;
    S.showGun = false;
    S.shootMode = false;
    S.ammo = 20;
    shootWrap.style.display = 'none';

    S.npcQuestionOpened = false;

    S.shootTimer = 0;
    S.didAllowed = false;

    S.camX = 0;

    npc.active = false;
    target.active = false;

    npc.greeted = false;

    target.alive = false;
    target.hit = false;

    moveDir = 0;

    player.x = 140;
    player.y = groundY() - player.h;
    player.vy = 0;
    player.onGround = true;
    player.faceDir = 1;
    player.stepT = 0;
    player.stepFrozen = false;

    spawnNpc();
    showToast('سلام', 650);
  }

  function openStageQuestions(){
    setOverlay(true, 'انتخاب کن', 'وقتی نزدیک می‌شی، انتخاب کن.', [
      { label:'سوال ۱: کلت می‌خوای؟', onClick: ()=> startShootMode() },
      { label:'سوال ۲: کلت نمی‌خوام', onClick: ()=>{
        setOverlay(false);
        showToast('DID', 800);
        setResult('DID — بازی مجدد');
      } }
    ]);
  }

  function startShootMode(){
    if(S.transitionLock || S.victoryLock) return;
    S.transitionLock = true;

    setOverlay(false);
    S.overlayOpen = false;

    // مرحله شوت
    S.stage = 1;
    S.showGun = true;
    S.shootMode = true;
    S.victoryLock = false;

    S.ammo = 20;
    shootAmmoEl.textContent = '20';
    shootWrap.style.display = 'block';

    S.shootTimer = 0;
    S.didAllowed = false;

    spawnTarget();

    showToast('۲۰ ثانیه وقت داری! شوت کن یا نزدیک میشه!', 1300);

    setTimeout(()=>{ S.transitionLock = false; }, 80);
  }

  function doVictoryAndReset(){
    // ✅ موفقیت: هیچ منوی NPC نباید بیاد؛ ریست کنترل‌شده
    S.victoryLock = true;

    S.showGun = false;
    S.shootMode = false;
    shootWrap.style.display = 'none';

    target.active = false;
    target.alive = false;
    target.hit = true;

    // اجازه DID یا NPC سوال دیگه نمی‌دیم چون victoryLock تداخل رو می‌بنده
    S.stage = 0;
    S.npcQuestionOpened = true; // تا در همین فریم‌ها سوال دوباره باز نشه

    showToast('موفق شدی!', 800);

    setTimeout(()=>{
      resetAll();
    }, 900);
  }

  function doDID(){
    if(S.victoryLock) return;
    S.didAllowed = false;
    S.shootMode = false;
    S.showGun = false;
    shootWrap.style.display = 'none';
    target.active = false;

    setResult('DID — باید شوت می‌کردی');
    showToast('DID', 900);
  }

  // input
  function bindHold(btn, dir){
    btn.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      btn.setPointerCapture?.(e.pointerId);
      moveDir = dir;
    }, {passive:false});
    btn.addEventListener('pointerup', (e)=>{
      e.preventDefault();
      moveDir = 0;
    }, {passive:false});
    btn.addEventListener('pointercancel', ()=> moveDir = 0, {passive:false});
  }
  bindHold(btnForward, +1);
  bindHold(btnBack, -1);

  btnJump.addEventListener('click', (e)=>{
    e.preventDefault();
    if(S.overlayOpen || S.didShowing || S.shootMode) return;
    if(player.onGround){
      player.vy = player.jumpV;
      player.onGround = false;
    }
  });

  btnShoot.addEventListener('click', ()=>{
    if(!S.shootMode) return;
    if(S.overlayOpen || S.didShowing) return;
    if(S.victoryLock) return;

    if(!target.active || !target.alive || target.hit) return;

    if(S.ammo <= 0){
      showToast('تیر تموم!', 800);
      return;
    }

    S.ammo -= 1;
    shootAmmoEl.textContent = String(S.ammo);

    // در این سناریو: اولین شوت موفق = پایان
    target.hit = true;
    target.alive = false;
    target.active = false;

    setTimeout(()=>doVictoryAndReset(), 200);
  });

  restartBtn.addEventListener('click', ()=> resetAll());

  // game loop
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;

    const frozen = S.overlayOpen || S.didShowing || S.victoryLock;
    player.stepFrozen = frozen;

    if(!frozen){
      if(moveDir !== 0) player.faceDir = moveDir;
      player.x += moveDir * player.speed * dt;

      if(!player.onGround){
        player.vy += player.gravity * dt;
        player.y += player.vy * dt;
      }

      const gy = groundY();
      const floorY = gy - player.h;
      if(player.y >= floorY){
        player.y = floorY;
        player.vy = 0;
        player.onGround = true;
      }

      if(player.onGround && moveDir !== 0){
        player.stepT += dt * 8;
      }

      const targetCam = player.x - (W*0.25);
      S.camX += (targetCam - S.camX) * Math.min(1, dt*8);
    } else {
      moveDir = 0;
    }

    // سوال NPC فقط یکبار
    if(S.stage === 0 && npc.active && !S.didShowing && !S.shootMode && !S.overlayOpen && !S.victoryLock){
      const npcScreenX = npc.x - S.camX;
      const playerScreenX = player.x - S.camX;
      const near = Math.abs((playerScreenX + 22) - (npcScreenX + 22)) < 70;

      if(near && !S.npcQuestionOpened){
        S.npcQuestionOpened = true;
        showToast('سلام', 650);
        setTimeout(openStageQuestions, 220);
      }
    }

    // shoot mode logic
    if(S.stage === 1 && S.shootMode && target.active && !S.didShowing && !S.victoryLock){
      S.shootTimer += dt;
      target.x -= target.speed * dt;

      if(S.shootTimer >= S.shootTimeLimit){
        S.didAllowed = true;
      }

      if(S.didAllowed){
        // شرط DID: اگر تا پایان زمان شوت نکردی و نزدیک شدی
        const dist = Math.abs(target.x - player.x);
        if(dist < 48){
          doDID();
        }
      }
    }

    // draw
    drawBackground(now);

    if(S.stage === 0 && npc.active && !S.didShowing && !S.victoryLock){
      drawNPC();
    }

    if(S.stage === 1 && target.active && target.alive && !S.didShowing && !S.victoryLock){
      const xScreen = target.x - S.camX;
      const gy = groundY();

      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = 'rgba(25,211,255,.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(xScreen, gy - player.h + 18, 34, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();

      drawCartoon(xScreen - 10, gy - player.h, 1, {});
    }

    const pxScreen = player.x - S.camX;
    const gy = groundY();
    const bob = (!S.overlayOpen && !S.didShowing && !S.shootMode && !S.victoryLock && player.onGround)
      ? Math.sin(player.stepT*0.14)*3 : 0;

    drawCartoon(pxScreen, player.y + bob, player.faceDir, { showGun: S.showGun });

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
  resetAll();
})();
</script>
</body>
</html>
