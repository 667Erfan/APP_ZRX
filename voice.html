<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voice Chat Room</title>
  <style>
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:#0b1220; color:#e5e7eb;
      display:flex; justify-content:center; padding:24px;
    }
    .app{ width:min(900px, 100%); }
    header{
      display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px;
    }
    .card{
      background:#0f1a2f; border:1px solid rgba(255,255,255,.08);
      border-radius:14px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2);
    }
    .topbar{
      padding:14px 16px;
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      background:linear-gradient(90deg, rgba(99,102,241,.25), rgba(34,211,238,.15));
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .title{ font-weight:800; letter-spacing:.2px; }
    .pill{
      font-size:12px; padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.15); color:#c7d2fe;
      background:rgba(99,102,241,.08);
      white-space:nowrap;
    }
    .content{ padding:16px; display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .panel{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:14px;
    }
    label{ display:block; font-size:12px; color:#b6c2d9; margin-bottom:8px; }
    input{
      width:100%; padding:11px 12px; border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:#0b1220; color:#e5e7eb; outline:none;
    }
    input:focus{ border-color: rgba(99,102,241,.65); box-shadow:0 0 0 4px rgba(99,102,241,.18); }
    .row{ display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
    button{
      border:0; cursor:pointer; border-radius:12px;
      padding:11px 14px; font-weight:800;
      background:#4f46e5; color:#fff;
      transition:transform .05s ease, filter .15s ease;
      white-space:nowrap;
    }
    button.secondary{ background:#1f2a44; border:1px solid rgba(255,255,255,.12); }
    button.danger{ background:#dc2626; }
    button:disabled{ opacity:.55; cursor:not-allowed; }
    .status{
      margin-top:10px; font-size:13px; color:#cbd5e1; line-height:1.7;
      min-height:44px;
    }
    .chat{
      height:360px; overflow:auto; padding:12px;
      background:#0b1220; border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
    }
    .msg{
      margin:10px 0; display:flex; gap:10px;
    }
    .msg .bubble{
      max-width:85%;
      padding:10px 12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      white-space:pre-wrap; word-wrap:break-word; line-height:1.6;
      font-size:14px;
    }
    .msg.user .bubble{
      background:rgba(99,102,241,.18); border-color:rgba(99,102,241,.35);
      margin-right:auto;
    }
    .msg.bot .bubble{
      background:rgba(34,211,238,.14); border-color:rgba(34,211,238,.28);
      margin-left:auto;
    }
    .controls{ margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; }
    .small{ font-size:12px; color:#94a3b8; }
    .log{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:12px; color:#93c5fd;
      background:#050a14; border:1px solid rgba(255,255,255,.06);
      padding:10px; border-radius:12px; margin-top:10px; max-height:120px; overflow:auto;
      white-space:pre-wrap;
    }
    .disabledOverlay{
      opacity:.6;
      pointer-events:none;
      filter:saturate(.6);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">Voice Room (ساخت روم / ورود / صحبت)</div>
      <div class="pill" id="envPill">در حال بررسی مرورگر…</div>
    </header>

    <div class="card">
      <div class="topbar">
        <div>
          <div style="font-weight:900">روم: <span id="roomName">—</span></div>
          <div class="small">برای تست: دو تب باز کن و هر دو را با یک Room Name وارد کن.</div>
        </div>
        <div class="row" style="margin:0">
          <button class="secondary" id="leaveBtn" disabled>خروج از روم</button>
        </div>
      </div>

      <div class="content">
        <!-- Left: room + mic -->
        <div class="panel" id="leftPanel">
          <label>نام روم (مثل: demo-1)</label>
          <input id="roomInput" value="demo-1" autocomplete="off"/>

          <div class="row">
            <button id="createBtn">ساخت روم</button>
            <button id="joinBtn" class="secondary">ورود به روم</button>
          </div>

          <div class="status" id="statusText">ابتدا روم بساز یا وارد شو.</div>

          <div class="controls">
            <button id="micBtn" class="secondary" disabled>فعال کردن میکروفن / شروع حرف زدن</button>
            <button id="stopBtn" class="danger" disabled>قطع</button>
          </div>

          <div class="small" style="margin-top:10px; line-height:1.7">
            خروجی: متنِ شنیده‌شده + پاسخ ربات با صدای بلند (اگر Speech synthesis پشتیبانی شود).
          </div>

          <div class="log" id="logEl"></div>
        </div>

        <!-- Right: chat -->
        <div class="panel">
          <div class="chat" id="chatEl" aria-live="polite"></div>
          <div class="row" style="margin-top:12px;">
            <button id="clearBtn" class="secondary">پاک کردن چت</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ===== Utils =====
  const $ = (id) => document.getElementById(id);
  const logEl = $("logEl");
  function log(msg){
    const t = new Date().toLocaleTimeString("fa-IR");
    logEl.textContent += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setStatus(msg){ $("statusText").textContent = msg; }
  function updateEnvPill(text, color){
    const pill = $("envPill");
    pill.textContent = text;
    if(color) pill.style.borderColor = color;
  }

  function addMsg(text, role){
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    $("chatEl").appendChild(wrap);
    $("chatEl").scrollTop = $("chatEl").scrollHeight;
  }

  // ===== Speech Recognition & Synthesis =====
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canSTT = !!SpeechRecognition;
  const canTTS = "speechSynthesis" in window;

  updateEnvPill(
    (canSTT ? "Speech-to-Text ✅ " : "Speech-to-Text ❌ ") + (canTTS ? "TTS ✅" : "TTS ❌"),
    canSTT && canTTS ? "rgba(34,211,238,.35)" : "rgba(255,255,255,.15)"
  );

  // ===== Room signaling (same-origin/tab) =====
  let roomChannel = null;
  let localId = Math.random().toString(16).slice(2);
  let room = null;

  // ===== WebRTC =====
  let pc = null;
  let remoteReady = false;

  // ICE servers: public STUN (no TURN). For LAN/test OK; for internet may fail.
  const iceServers = [{ urls: "stun:stun.l.google.com:19302" }];

  function cleanupPeer(){
    try { pc && pc.ontrack = null; } catch {}
    try { pc && pc.onicecandidate = null; } catch {}
    try { pc && pc.close(); } catch {}
    pc = null;
    remoteReady = false;
  }

  function createPeerConnection(isInitiator){
    cleanupPeer();
    pc = new RTCPeerConnection({ iceServers });

    pc.onicecandidate = (e) => {
      if(e.candidate){
        roomChannel.postMessage({
          type: "ice",
          room,
          from: localId,
          candidate: e.candidate
        });
      }
    };

    pc.ontrack = (e) => {
      // اگر می‌خواهی صدا را هم بشنوی:
      // e.streams[0] وجود دارد.
      remoteReady = true;
      log("Remote track received.");
      // برای جلوگیری از باگ: این نسخه فقط نمایش و چت متن را انجام می‌دهد.
    };

    // ارسال صدا (از میکروفن) به ریموت:
    // ترَک را بعد از گرفتن مجوز میکروفن اضافه می‌کنیم.
    if(isInitiator){
      // Initiator یک offer می‌سازد وقتی آماده باشد (بعد از mic).
    }

    return pc;
  }

  async function ensureMicStream(){
    if(window._micStream) return window._micStream;

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("getUserMedia در این مرورگر پشتیبانی نمی‌شود.");
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });
    window._micStream = stream;
    return stream;
  }

  // ===== STT engine =====
  let recognition = null;
  let listening = false;

  function startSTT(){
    if(!canSTT){
      addMsg("SpeechRecognition در این مرورگر پشتیبانی نمی‌شود.", "bot");
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "fa-IR";
    recognition.interimResults = true;
    recognition.continuous = true;

    let finalText = "";

    recognition.onstart = () => {
      listening = true;
      $("micBtn").disabled = true;
      $("stopBtn").disabled = false;
      setStatus("در حال گوش دادن… حرف بزن.");
      log("STT started.");
    };

    recognition.onerror = (e) => {
      log("STT error: " + (e.error || "unknown"));
      setStatus("خطای SpeechRecognition رخ داد: " + (e.error || "نامشخص"));
    };

    recognition.onresult = (event) => {
      let interim = "";
      finalText = "";
      for(let i = event.resultIndex; i < event.results.length; i++){
        const res = event.results[i];
        const txt = res[0]?.transcript || "";
        if(res.isFinal){
          finalText += txt;
        } else {
          interim += txt;
        }
      }
      if(finalText.trim()){
        const msg = finalText.trim();
        addMsg(msg, "user");
        botAndSpeak(msg);
      }
    };

    recognition.onend = () => {
      listening = false;
      $("micBtn").disabled = false;
      $("stopBtn").disabled = true;
      setStatus("STT متوقف شد. اگر خواستی دوباره شروع کن.");
      log("STT ended.");
    };

    recognition.start();
  }

  function stopSTT(){
    try { recognition && recognition.stop(); } catch {}
    listening = false;
  }

  // ===== Bot logic =====
  function normalize(s){
    return (s || "").trim().replace(/\s+/g," ").toLowerCase();
  }

  function botReply(userText){
    const t = normalize(userText);
    if(t.includes("سلام") || t.startsWith("سلام") || t.includes("درود") || t.includes("hello")){
      return "سلام دوست عزیزم";
    }
    // اگر کاربر گفت: خوبی؟
    if(t.includes("خوبی") || t.includes("چطوری") || t.includes("حالت چطوره") || t.includes("حالت چطوری")){
      return "بله من خوب هستم شما چطور اگر کمکی نیاز دارید من در خدمتم";
    }
    if(t.includes("خوب") && t.includes("?")){ // حساس به متن
      return "بله من خوب هستم شما چطور اگر کمکی نیاز دارید من در خدمتم";
    }
    return "حتماً! بگو دقیقاً چه کمکی نیاز داری؟";
  }

  function speak(text){
    if(!canTTS) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fa-IR";
      u.rate = 1.0;
      u.pitch = 1.0;
      speechSynthesis.speak(u);
    }catch(e){
      log("TTS error: " + e.message);
    }
  }

  function botAndSpeak(userText){
    const reply = botReply(userText);
    addMsg(reply, "bot");
    speak(reply);
    // اگر بخوای، اینجا می‌تونی جواب را از طریق DataChannel هم sync کنی.
  }

  // ===== Signaling + WebRTC start =====
  let micTracksAdded = false;

  async function startWebRTCIfNeeded(){
    if(!roomChannel) throw new Error("Not in room.");
    const stream = await ensureMicStream();
    if(!pc) createPeerConnection(false);

    if(!micTracksAdded){
      micTracksAdded = true;
      for(const track of stream.getTracks()){
        pc.addTrack(track, stream);
      }
    }

    // Initiator creates offer when remote not ready.
  }

  async function createOffer(){
    if(!pc) return;
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    roomChannel.postMessage({ type:"offer", room, from: localId, offer });
  }

  async function handleOffer(msg){
    if(!pc) createPeerConnection(false);
    await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    roomChannel.postMessage({ type:"answer", room, from: localId, answer });
  }

  async function handleAnswer(msg){
    await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
  }

  async function handleIce(msg){
    if(!pc) return;
    try{
      await pc.addIceCandidate(msg.candidate);
    }catch(e){
      // برای جلوگیری از باگ‌های رایج، خطا را نادیده می‌گیریم مگر خیلی کلی
      log("ICE add error: " + e.message);
    }
  }

  // ===== Room actions =====
  function resetUIForRoom(entered){
    $("roomName").textContent = room || "—";
    $("leaveBtn").disabled = !entered;
    $("micBtn").disabled = !entered;
    $("stopBtn").disabled = true;

    if(!entered){
      $("leftPanel").classList.add("disabledOverlay");
      setStatus("ابتدا روم بساز یا وارد شو.");
    }else{
      $("leftPanel").classList.remove("disabledOverlay");
      setStatus("روم آماده است. حالا میکروفن را فعال کن و حرف بزن.");
    }
  }

  function bindChannel(){
    roomChannel = new BroadcastChannel(`voice-room:${room}`);
    roomChannel.onmessage = async (e) => {
      const msg = e.data;
      if(!msg || msg.room !== room) return;
      if(msg.from === localId) return;

      try{
        if(msg.type === "offer"){
          log("Received offer.");
          await startWebRTCIfNeeded();
          await handleOffer(msg);
        } else if(msg.type === "answer"){
          log("Received answer.");
          await handleAnswer(msg);
        } else if(msg.type === "ice"){
          log("Received ice.");
          await handleIce(msg);
        } else if(msg.type === "ping"){
          // optional
        }
      }catch(err){
        log("Channel handling error: " + err.message);
      }
    };
  }

  async function enterRoom(role){
    room = $("roomInput").value.trim() || "demo-1";
    $("roomName").textContent = room;

    if(roomChannel){
      try{ roomChannel.close(); }catch{}
      roomChannel = null;
    }
    cleanupPeer();
    micTracksAdded = false;

    bindChannel();
    resetUIForRoom(true);

    log(`Entered room "${room}" as ${role}.`);

    // اگر نقش initiator باشد، بعد از فعال شدن میکروفن offer می‌سازد.
    // (برای اینکه بدون ترک هم استیج نزنیم و باگ کمتر شود.)
    if(role === "create"){
      // Offer will be created once mic is enabled.
      setStatus("روم ساخته شد. میکروفن را فعال کن تا اتصال WebRTC شروع شود.");
    } else {
      setStatus("وارد شدی. میکروفن را فعال کن؛ منتظر offer/پاسخ بمان.");
    }
  }

  async function leaveRoom(){
    try{ stopSTT(); }catch{}
    try{
      if(roomChannel) roomChannel.close();
    }catch{}
    roomChannel = null;
    room = null;

    cleanupPeer();
    micTracksAdded = false;
    resetUIForRoom(false);

    try{ speechSynthesis.cancel(); }catch{}
    log("Left room.");
    $("roomName").textContent = "—";
  }

  // ===== Button handlers =====
  $("createBtn").addEventListener("click", async () => {
    try{
      $("createBtn").disabled = true;
      await enterRoom("create");
      // پیام اولیه ربات داخل چت
      addMsg("سلام دوست عزیزم", "bot");
      speak("سلام دوست عزیزم");
    }catch(e){
      log("Create error: " + e.message);
      setStatus("خطا در ساخت روم: " + e.message);
    }finally{
      $("createBtn").disabled = false;
    }
  });

  $("joinBtn").addEventListener("click", async () => {
    try{
      $("joinBtn").disabled = true;
      await enterRoom("join");
      // پیام اولیه ربات داخل چت
      addMsg("سلام دوست عزیزم", "bot");
      speak("سلام دوست عزیزم");
    }catch(e){
      log("Join error: " + e.message);
      setStatus("خطا در ورود به روم: " + e.message);
    }finally{
      $("joinBtn").disabled = false;
    }
  });

  $("leaveBtn").addEventListener("click", leaveRoom);

  $("micBtn").addEventListener("click", async async () => {
    // (این تکرار داره که باید حذف بشه)
  });

  $("micBtn").addEventListener("click", async () => {
    try{
      if(!room) return;
      if(!canSTT){
        setStatus("SpeechRecognition پشتیبانی نمی‌شود. با این مرورگر نمی‌توانم حرف را به متن تبدیل کنم.");
        return;
      }
      // شروع میکروفن و اتصال
      setStatus("در حال گرفتن میکروفن و آماده‌سازی اتصال…");
      $("micBtn").disabled = true;

      await ensureMicStream();

      // اگر initiator هست (همان تب create) offer بسازیم.
      // تشخیص initiator را ساده نگه می‌داریم: در createBtn پیام offer را می‌فرستیم.
      // برای این نسخه، از نظر UX: هر تب که mic را فعال کند، اگر pc خالی بود initiator می‌شود.
      if(!pc){
        createPeerConnection(true);
      }
      micTracksAdded = false; // تا ترک‌ها را اضافه کند (در startWebRTCIfNeeded)
      await startWebRTCIfNeeded();

      // اگر pc را initiator ساختیم، offer می‌فرستیم:
      // برای اینکه دقیق بدانیم initiator کیست، ما اینجا یک offer را ارسال می‌کنیم اگر localDescription خالی است.
      if(pc.signalingState === "stable"){
        await createOffer();
      }

      // STT را روشن کن
      startSTT();
    }catch(e){
      log("Mic error: " + e.message);
      setStatus("خطا در فعال کردن میکروفن: " + e.message);
      $("micBtn").disabled = false;
      $("stopBtn").disabled = true;
    }
  });

  $("stopBtn").addEventListener("click", () => {
    stopSTT();
    setStatus("قطع شد.");
  });

  $("clearBtn").addEventListener("click", () => {
    $("chatEl").innerHTML = "";
    log("Chat cleared.");
  });

  // ===== Browser permission reminder =====
  document.addEventListener("visibilitychange", () => {
    if(document.hidden){
      // بهتر است روی باگ‌های مرورگر، STT را قطع کنیم
      try { if(listening) stopSTT(); } catch {}
    }
  });

})();
</script>
</body>
</html>
