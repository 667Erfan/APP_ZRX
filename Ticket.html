<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticket</title>
  <style>
    body{font-family:tahoma; background:#0b1220; color:#e8eefc; margin:0; padding:16px}
    .wrap{max-width:980px; margin:auto; display:grid; gap:16px}
    .card{background:#111a2e; border:1px solid #203055; border-radius:12px; padding:16px}
    input,textarea,button,select{width:100%; box-sizing:border-box; margin-top:8px; padding:10px; border-radius:10px; border:1px solid #2a3b63; background:#0b1220; color:#e8eefc}
    button{cursor:pointer; background:#1f6feb; border:none; font-weight:700}
    button.secondary{background:#23314f}
    .row{display:grid; grid-template-columns: 1fr 1fr; gap:12px}
    @media (max-width:800px){.row{grid-template-columns:1fr}}
    .tickets{display:grid; gap:10px}
    .ticket{border:1px solid #203055; padding:12px; border-radius:12px; background:#0f1730}
    .meta{display:flex; gap:12px; flex-wrap:wrap; opacity:.9; font-size:13px}
    .tag{padding:4px 8px; border:1px solid #2a3b63; border-radius:999px}
    .files img{max-width:180px; max-height:120px; border-radius:10px; margin:6px 8px 0 0; border:1px solid #2a3b63}
    .reply{margin-top:10px; border-top:1px dashed #2a3b63; padding-top:10px}
    .muted{opacity:.75; font-size:13px}
    .hidden{display:none}
    .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
    .topbar .title{font-size:18px; font-weight:900}
    .hr{height:1px; background:#203055; margin:12px 0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">ثبت تیکت</div>
      <div class="muted">(نمایش‌ها برای همان دستگاه/مرورگر است)</div>
    </div>

    <!-- Customer -->
    <section class="card" id="customerCard">
      <div class="row">
        <div>
          <label>نام/شناسه شما</label>
          <input id="name" placeholder="مثلاً علی" />
        </div>
        <div>
          <label>موضوع</label>
          <input id="subject" placeholder="مثلاً مشکل لاگین" />
        </div>
      </div>

      <label>شرح مشکل</label>
      <textarea id="message" rows="4" placeholder="توضیحات..."></textarea>

      <label>تصویر (اختیاری)</label>
      <input id="photo" type="file" accept="image/*" />

      <button id="submitTicket">ثبت تیکت</button>
      <div class="muted" id="custStatus" style="margin-top:10px"></div>
    </section>

    <!-- Admin -->
    <section class="card" id="adminCard">
      <div class="row">
        <div>
          <label>ورود ادمین (پین)</label>
          <input id="adminPin" type="password" placeholder="مثلاً 1234"/>
        </div>
        <div>
          <label>حالت</label>
          <select id="mode">
            <option value="agent">ادمین/نمایش تیکت‌ها</option>
            <option value="readonly">فقط خواندن</option>
          </select>
        </div>
      </div>

      <button class="secondary" id="adminLogin">ورود به پنل ادمین</button>
      <div class="muted" id="adminStatus" style="margin-top:10px"></div>

      <div class="hr"></div>

      <div class="tickets" id="tickets"></div>
      <div class="muted" id="emptyState" style="margin-top:10px">هنوز تیکتی ثبت نشده.</div>
    </section>
  </div>

  <script>
    /***************
     * تنظیمات
     ***************/
    // اگر پین درست را می‌خواهی عوض کن
    const ADMIN_PIN = "1234";

    // کلیدهای localStorage
    const LS_TICKETS = "tickets:v1";

    // مدیریت اعداد/زمان
    const nowISO = () => new Date().toISOString();
    const uid = () => Math.random().toString(16).slice(2) + "-" + Date.now().toString(16);

    // قالب تیکت:
    // { id, owner, name, subject, message, photos:[{name,dataUrl}], createdAt, replies:[{text,createdAt}] }
    function readTickets(){
      try {
        return JSON.parse(localStorage.getItem(LS_TICKETS) || "[]");
      } catch {
        return [];
      }
    }
    function writeTickets(list){
      localStorage.setItem(LS_TICKETS, JSON.stringify(list));
    }

    function formatFaDate(iso){
      try{
        const d = new Date(iso);
        return d.toLocaleString("fa-IR");
      }catch{
        return iso;
      }
    }

    async function fileToDataURL(file){
      return new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /***************
     * Customer
     ***************/
    const $ = (id)=>document.getElementById(id);

    $("submitTicket").addEventListener("click", async ()=>{
      const name = $("name").value.trim() || "ناشناس";
      const subject = $("subject").value.trim();
      const message = $("message").value.trim();
      const files = $("photo").files;

      if(!subject){
        $("custStatus").textContent = "لطفاً موضوع را وارد کنید.";
        return;
      }
      if(!message){
        $("custStatus").textContent = "لطفاً شرح مشکل را وارد کنید.";
        return;
      }

      $("custStatus").textContent = "در حال ثبت...";

      let photos = [];
      if(files && files.length){
        // اگر حجم خیلی زیاد شد ممکن است مرورگر محدود کند، ولی این روش کار می‌کند
        const arr = [];
        for (const f of files){
          const dataUrl = await fileToDataURL(f);
          arr.push({ name: f.name, dataUrl });
        }
        photos = arr;
      }

      const tickets = readTickets();
      const ticket = {
        id: uid(),
        // owner اختیاری است؛ اینجا می‌گذاریم همه در همان مرورگر ببینند
        owner: "same-browser",
        name,
        subject,
        message,
        photos,
        createdAt: nowISO(),
        replies: []
      };

      tickets.unshift(ticket);
      writeTickets(tickets);

      $("custStatus").textContent = "تیکت شما ثبت شد ✅";
      $("message").value = "";
      $("subject").value = "";
      $("photo").value = "";
    });

    /***************
     * Admin UI
     ***************/
    let isAdmin = false;

    $("adminLogin").addEventListener("click", ()=>{
      const pin = $("adminPin").value.trim();
      if(pin !== ADMIN_PIN){
        $("adminStatus").textContent = "پین اشتباه است.";
        isAdmin = false;
        renderTickets();
        return;
      }
      isAdmin = true;
      $("adminStatus").textContent = "ورود موفق ✅";
      renderTickets();
    });

    function createReplyBox(ticket){
      const mode = $("mode").value;

      const container = document.createElement("div");
      container.className = "reply";

      const title = document.createElement("div");
      title.className = "muted";
      title.textContent = "پاسخ ادمین:";
      container.appendChild(title);

      const repliesWrap = document.createElement("div");
      (ticket.replies || []).forEach(r=>{
        const div = document.createElement("div");
        div.style.marginTop = "8px";
        div.style.padding = "10px";
        div.style.border = "1px solid #2a3b63";
        div.style.borderRadius = "10px";
        div.style.background = "#0b1220";
        div.innerHTML = `
          <div class="muted">${formatFaDate(r.createdAt)}</div>
          <div style="margin-top:6px; white-space:pre-wrap;">${escapeHtml(r.text)}</div>
        `;
        repliesWrap.appendChild(div);
      });
      container.appendChild(repliesWrap);

      if(isAdmin && mode !== "readonly"){
        const input = document.createElement("textarea");
        input.rows = 3;
        input.placeholder = "پاسخ را بنویس...";
        input.style.marginTop = "10px";

        const btn = document.createElement("button");
        btn.textContent = "ارسال پاسخ";
        btn.className = "";
        btn.style.marginTop = "8px";
        btn.addEventListener("click", ()=>{
          const text = input.value.trim();
          if(!text) return;

          const list = readTickets();
          const idx = list.findIndex(t=>t.id === ticket.id);
          if(idx === -1) return;

          list[idx].replies = list[idx].replies || [];
          list[idx].replies.unshift({ text, createdAt: nowISO() });
          writeTickets(list);

          input.value = "";
          renderTickets();
        });

        container.appendChild(input);
        container.appendChild(btn);
      }

      return container;
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function renderTickets(){
      const tickets = readTickets();
      const wrap = $("tickets");
      const empty = $("emptyState");

      wrap.innerHTML = "";
      empty.style.display = tickets.length ? "none" : "block";

      const mode = $("mode").value;

      tickets.forEach(ticket=>{
        const el = document.createElement("div");
        el.className = "ticket";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `
          <span class="tag">#${escapeHtml(ticket.id.slice(0,8))}</span>
          <span class="tag">کاربر: ${escapeHtml(ticket.name || "ناشناس")}</span>
          <span class="tag">زمان: ${escapeHtml(formatFaDate(ticket.createdAt))}</span>
        `;
        el.appendChild(meta);

        const subj = document.createElement("div");
        subj.style.marginTop = "8px";
        subj.style.fontWeight = "900";
        subj.textContent = ticket.subject || "";
        el.appendChild(subj);

        const msg = document.createElement("div");
        msg.style.marginTop = "8px";
        msg.style.whiteSpace = "pre-wrap";
        msg.textContent = ticket.message || "";
        el.appendChild(msg);

        if(ticket.photos && ticket.photos.length){
          const files = document.createElement("div");
          files.className = "files";
          ticket.photos.forEach(p=>{
            const img = document.createElement("img");
            img.src = p.dataUrl;
            img.alt = p.name || "photo";
            files.appendChild(img);
          });
          el.appendChild(files);
        }

        // اگر تیکت‌ها بدون ادمین هم باید دیده شوند:
        // بلی، فقط امکان پاسخ دادن بسته به isAdmin/readonly
        el.appendChild(createReplyBox(ticket));
        wrap.appendChild(el);
      });
    }

    // بروزرسانی خودکار وقتی تیکت در همان مرورگر/تب ایجاد شود
    window.addEventListener("storage", (e)=>{
      if(e.key === LS_TICKETS){
        renderTickets();
      }
    });

    // همچنین برای رفرش/باز شدن صفحه
    renderTickets();
  </script>
</body>
</html>
