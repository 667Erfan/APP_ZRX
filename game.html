<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>Blue Coin Aim Game</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif;}
    #wrap{position:relative;width:100vw;height:100vh;}
    canvas{display:block;width:100vw;height:100vh;touch-action:none;}
    #hud{
      position:absolute;left:12px;top:12px;
      color:#fff;font-size:14px;line-height:1.6;
      user-select:none;pointer-events:none;
      text-shadow:0 2px 10px rgba(0,0,0,.6);
    }
    #btn{
      position:absolute;right:12px;top:12px;
      padding:10px 14px;border-radius:12px;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(0,0,0,.35);color:#fff;
      cursor:pointer;user-select:none;
    }
    #btn:active{transform:translateY(1px);}
    #centerMsg{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:38px;font-weight:800;
      pointer-events:none;opacity:0;
      text-shadow:0 10px 40px rgba(0,0,0,.8);
      transition:opacity .2s ease;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="btn">Start</div>
    <div id="centerMsg"></div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const hud = document.getElementById('hud');
  const btn = document.getElementById('btn');
  const centerMsg = document.getElementById('centerMsg');

  // world coordinates
  const W = 1000, H = 600;

  // DPR-resize
  let dpr = 1;
  const ctx = canvas.getContext('2d', { alpha: false });

  function resize(){
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const rect = canvas.getBoundingClientRect();
    canvas.width  = Math.floor(rect.width  * dpr);
    canvas.height = Math.floor(rect.height * dpr);
  }
  window.addEventListener('resize', resize, {passive:true});
  resize();

  // game state
  const game = {
    running:false,
    timeLeft:30,
    hp:100,
    score:0,
    coins:0,
    targets:[],
    nextId:1,
    spawnAcc:0
  };

  // aim rules
  const aim = {
    maxTargets: 40,      // جلوی آشفتگی
    spawnEvery: 0.18,   // اسپاون کنترل‌شده
    blueChance: 0.55,   // زیاد کلیک هم حذف کنه، باز میاد
    bombChance: 0.18,   // بمب‌ها کم‌تر
    normalChance: 0.27, // بقیه زرد
    radius: 16
  };

  const COLORS = {
    bg: '#0b0b10',
    blue: '#3aa0ff',
    bomb: '#ff3a3a',
    normal: '#ffd24a',
    ring: 'rgba(255,255,255,.22)',
    shadow: 'rgba(0,0,0,.35)'
  };

  function clientToWorld(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const px = (clientX - rect.left) / rect.width;
    const py = (clientY - rect.top) / rect.height;
    return { x: px * W, y: py * H };
  }

  function reset(){
    game.running = true;
    game.timeLeft = 30;
    game.hp = 100;
    game.score = 0;
    game.coins = 0;
    game.targets.length = 0;
    game.nextId = 1;
    game.spawnAcc = 0;
    btn.textContent = 'Running...';
    centerMsg.style.opacity = 0;
  }

  function spawnOne(){
    if (!game.running) return;
    if (game.targets.length >= aim.maxTargets) return;

    const r = aim.radius;
    const pad = r + 10;
    const x = pad + Math.random() * (W - 2*pad);
    const y = pad + Math.random() * (H - 2*pad);

    const roll = Math.random();
    let type = 'normal';
    if (roll < aim.blueChance) type = 'blue';
    else if (roll < aim.blueChance + aim.bombChance) type = 'bomb';

    const color = (type === 'blue') ? COLORS.blue
                : (type === 'bomb') ? COLORS.bomb
                : COLORS.normal;

    game.targets.push({ id: game.nextId++, x, y, r, type, color });
  }

  // hit only nearest target under pointer
  function hitAt(wx, wy){
    let best = -1;
    let bestD2 = Infinity;

    for (let i=0;i<game.targets.length;i++){
      const t = game.targets[i];
      const dx = wx - t.x, dy = wy - t.y;
      const rr = t.r * t.r;
      const d2 = dx*dx + dy*dy;
      if (d2 <= rr && d2 < bestD2){
        bestD2 = d2;
        best = i;
      }
    }

    if (best === -1) return;

    const t = game.targets[best];
    game.targets.splice(best, 1); // حذف درست -> آبی “گم” نمی‌شه چون بعداً دوباره spawn میشه

    if (t.type === 'blue'){
      // پولک آبی: هم امتیاز، هم coins
      game.coins += 1;
      game.score += 10;
    } else if (t.type === 'bomb'){
      game.hp -= 15;
      game.score -= 5;
    } else {
      game.score += 5;
    }
  }

  // input
  canvas.addEventListener('pointerdown', (e) => {
    if (!game.running) return;
    e.preventDefault();
    e.stopPropagation();
    const {x,y} = clientToWorld(e.clientX, e.clientY);
    hitAt(x,y);
  }, { passive:false });

  function draw(){
    // IMPORTANT: clear every frame -> prevents "blue whole page" bug
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // scale to world size
    const scaleX = (canvas.width / dpr) / W;
    const scaleY = (canvas.height / dpr) / H;

    ctx.save();
    ctx.scale(scaleX, scaleY);

    for (const t of game.targets){
      // body
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
      ctx.fillStyle = t.color;
      ctx.globalAlpha = 0.95;
      ctx.fill();

      // ring
      ctx.globalAlpha = 1;
      ctx.lineWidth = 3;
      ctx.strokeStyle = COLORS.ring;
      ctx.stroke();

      // coin/prefix (blue coin should look "blue" explicitly)
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (t.type === 'blue'){
        // پولک آبی
        ctx.font = '18px sans-serif';
        ctx.fillText('💠', t.x, t.y + 1);
      } else if (t.type === 'bomb'){
        ctx.font = '22px sans-serif';
        ctx.fillText('!', t.x, t.y + 1);
      } else {
        ctx.font = '18px sans-serif';
        ctx.fillText('★', t.x, t.y + 1);
      }
    }

    ctx.restore();
  }

  let last = performance.now();
  function tick(now){
    const dt = (now - last) / 1000;
    last = now;

    if (game.running){
      game.timeLeft -= dt;
      game.spawnAcc += dt;

      // spawn controlled (no while explosion per frame)
      while (game.spawnAcc >= aim.spawnEvery){
        game.spawnAcc -= aim.spawnEvery;
        spawnOne();
        // safety: اگر خیلی جمع شد، بیشتر spawn نکن
        if (game.targets.length >= aim.maxTargets) break;
      }

      if (game.timeLeft <= 0 || game.hp <= 0){
        game.running = false;
        btn.textContent = 'Start';
        centerMsg.textContent = (game.hp <= 0) ? 'Game Over' : 'Finished';
        centerMsg.style.opacity = 1;
      }
    }

    hud.innerHTML = `
      <div><b>Time:</b> ${Math.max(0, game.timeLeft).toFixed(1)}</div>
      <div><b>HP:</b> ${game.hp}</div>
      <div><b>Coins:</b> ${game.coins}</div>
      <div><b>Score:</b> ${game.score}</div>
      <div style="opacity:.85;margin-top:4px;"><b>Targets:</b> ${game.targets.length}</div>
    `;

    draw();
    requestAnimationFrame(tick);
  }

  btn.addEventListener('click', () => reset());
  reset();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
