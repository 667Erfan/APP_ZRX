<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>NEON RUN - game.html</title>
  <style>
    :root{--bg0:#05060a;--bg1:#070a1a;--neon1:#7c5cff;--neon2:#19d3ff;--text:#eaf0ff;--muted:rgba(234,240,255,.7);}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);
      background:linear-gradient(180deg,var(--bg0),var(--bg1));
      overflow:hidden;
      touch-action:none; -webkit-user-select:none; user-select:none;
    }
    #c{position:fixed;inset:0;width:100%;height:100%;display:block;}
    .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px;gap:10px;}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
    .panel{
      pointer-events:auto;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      box-shadow:0 18px 70px rgba(0,0,0,.35);
      backdrop-filter:blur(6px);
      padding:10px 12px;
    }
    .hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.18);font-weight:900;font-size:12px;white-space:nowrap;}
    .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.2);box-shadow:0 0 18px rgba(255,255,255,.18);}
    .dot.p1{background: rgba(124,92,255,.9); border-color: rgba(124,92,255,.5); box-shadow:0 0 22px rgba(124,92,255,.5);}
    .dot.p2{background: rgba(25,211,255,.9); border-color: rgba(25,211,255,.5); box-shadow:0 0 22px rgba(25,211,255,.5);}
    .dot.p3{background: rgba(46,229,157,.9); border-color: rgba(46,229,157,.5); box-shadow:0 0 22px rgba(46,229,157,.5);}
    .dot.bad{background: rgba(255,77,109,.85); border-color: rgba(255,77,109,.45); box-shadow:0 0 22px rgba(255,77,109,.35);}
    .center{align-items:center;justify-content:center;display:flex;flex:1;}
    .modal{
      pointer-events:auto;width:min(720px,96vw);padding:18px;border-radius:18px;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.05));
      box-shadow:0 40px 150px rgba(0,0,0,.55);position:relative;overflow:hidden;
      display:none;
    }
    .modal.show{display:block;}
    .modal::before{content:"";position:absolute;inset:-2px;opacity:.9;
      background:radial-gradient(800px 260px at 30% 0%, rgba(124,92,255,.22), transparent 60%),
                 radial-gradient(700px 260px at 80% 30%, rgba(25,211,255,.18), transparent 60%);
      pointer-events:none;
    }
    .modal > *{position:relative}
    .title{font-size:22px;font-weight:1000;letter-spacing:.4px;margin-bottom:6px;}
    .subtitle{color:var(--muted);line-height:1.7;font-size:13px;margin:0 0 12px;}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:center;}
    button{
      pointer-events:auto;cursor:pointer;border:0;border-radius:14px;
      padding:12px 16px;font-weight:1000;letter-spacing:.3px;color:#071018;
      background:linear-gradient(135deg,var(--neon1),var(--neon2));
      box-shadow:0 14px 40px rgba(124,92,255,.30);
    }
    button:active{transform:scale(.98)}
    .ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.14);box-shadow:none;}
    .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;}
    .help{pointer-events:auto;max-width:520px;color:var(--muted);font-size:12px;line-height:1.8;background:rgba(255,255,255,.06);}
    .bar{pointer-events:auto;width:min(420px,86vw);padding:10px 12px;}
    .meter{height:10px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.10);overflow:hidden;position:relative;}
    .meter > span{position:absolute;inset:0;width:50%;background:linear-gradient(90deg,rgba(124,92,255,.9),rgba(25,211,255,.9));box-shadow:0 0 26px rgba(124,92,255,.35);}
    .mobileCtrls{
      display:none;pointer-events:auto;position:fixed;left:14px;right:14px;bottom:14px;
      gap:10px;justify-content:space-between;align-items:flex-end;
    }
    .btnBig{
      width:92px;height:92px;border-radius:24px;background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.18);color:var(--text);display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:manipulation;
      box-shadow:none;
    }
    .btnBig.active{background:linear-gradient(135deg,var(--neon1),var(--neon2));color:#071018;border-color:transparent;box-shadow:0 14px 40px rgba(124,92,255,.30);}
    @media (max-width:720px){.mobileCtrls{display:flex}.help{display:none}.bar{width:100%;}}
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui">
  <div class="topbar">
    <div class="panel hud">
      <div class="chip"><span class="dot p1"></span> <span id="score">0</span> امتیاز</div>
      <div class="chip"><span class="dot p2"></span> <span id="coins">0</span> پولک</div>
      <div class="chip"><span class="dot p3"></span> <span id="level">1</span> لول</div>
    </div>
    <div class="panel hud">
      <div class="chip"><span class="dot bad"></span> جان: <span id="hp">3</span></div>
      <div class="chip">وضعیت: <span id="stateTxt">آماده</span></div>
    </div>
  </div>

  <div class="center">
    <div class="modal" id="modal">
      <div class="title">NEON RUN</div>
      <p class="subtitle">هدف: جمع کردن پولک‌های نئونی و دور شدن از موانع.</p>
      <p class="subtitle" style="margin-top:0">
        لپ‌تاپ: <b>A</b>/<b>D</b> حرکت، <b>Space</b> پرش<br/>
        موبایل: کشیدن حرکت افقی، دکمه پرش (یا تپ صفحه)
      </p>
      <div class="btnrow">
        <button id="startBtn">شروع بازی</button>
        <button id="restartBtn" class="ghost" style="display:none">شروع مجدد</button>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="help panel" id="helpBox"><strong>ترفند:</strong> پولک‌ها را جمع کن. برخورد = کم شدن جان.</div>
    <div class="bar panel">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;color:var(--muted);font-size:12px;">
        <span>پیشرفت لول</span><span id="progTxt">0/0</span>
      </div>
      <div class="meter"><span id="progBar"></span></div>
    </div>
  </div>
</div>

<div class="mobileCtrls">
  <div class="btnBig" id="jumpBtn">پرش</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const coinsEl = document.getElementById('coins');
  const levelEl = document.getElementById('level');
  const hpEl = document.getElementById('hp');
  const stateTxt = document.getElementById('stateTxt');
  const progBar = document.getElementById('progBar');
  const progTxt = document.getElementById('progTxt');

  const modal = document.getElementById('modal');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const jumpBtn = document.getElementById('jumpBtn');

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rand=(a,b)=>a+Math.random()*(b-a);
  const lerp=(a,b,t)=>a+(b-a)*t;

  let W=0,H=0,dpr=1;
  function resize(){
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  function neonCircle(x,y,r,outer,inner){
    ctx.save();
    ctx.shadowBlur = 26;
    ctx.shadowColor = outer;
    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = inner || 'rgba(124,92,255,.2)';
    ctx.beginPath();
    ctx.arc(x,y,r*0.6,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function glowLine(x1,y1,x2,y2,color,th=2){
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = th;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
    ctx.restore();
  }

  // Game state
  let running = false;
  let lastT = 0;
  const game = {
    time:0, score:0, coins:0, level:1, hp:3,
    speed:220,
    needCoins(){ return 10 + (this.level-1)*6; },
    progress(){ return {cur:this.coins%this.needCoins(), total:this.needCoins()}; }
  };
  const player = {
    x:0,y:0,r:14,
    vx:0,vy:0,targetX:0,onGround:true,invuln:0,
    moveSpeed:540,jumpForce:520,jumpCooldown:0
  };
  const atoms = {coins:[], obstacles:[], particles:[], sparks:[]};
  const bg = {stars:[]};

  function initBg(){
    bg.stars.length=0;
    const count = Math.floor((W*H)/45000);
    for(let i=0;i<count;i++){
      bg.stars.push({
        x:rand(0,W), y:rand(0,H),
        r:rand(0.6,2.2), a:rand(0.05,0.22),
        vx:rand(-0.15,0.15), vy:rand(0.3,1.0),
        hue: Math.random()<0.5 ? 260 : 195
      });
    }
  }

  function spawnCoin(initial=false){
    const x = rand(30, W-30);
    const y = initial ? rand(H*0.08, H*0.75) : -30 - rand(0, H*0.55);
    const r = rand(10,13);
    const hue = Math.random()<0.5 ? 260 : 195;
    atoms.coins.push({x,y,r,hue,rot:rand(0,Math.PI*2),wob:rand(0,Math.PI*2),alive:true});
  }

  function spawnObstacle(initial=false){
    const x = rand(30, W-30);
    const y = initial ? rand(H*0.1, H*0.75) : -70 - rand(0, H*0.65);
    const w = rand(26,46), h = rand(18,34);
    const kind = Math.random()<0.5 ? "bar" : "block";
    atoms.obstacles.push({x,y,w,h,kind,phase:rand(0,Math.PI*2),alive:true});
  }

  function reset(){
    running = false; // فقط برای جلوگیری از دوبار اجرا
    game.time=0; game.score=0; game.coins=0; game.level=1; game.hp=3; game.speed=220;

    player.x=W/2; player.y=H*0.72;
    player.vx=0; player.vy=0; player.targetX=player.x;
    player.onGround=true; player.invuln=0; player.jumpCooldown=0;

    atoms.coins.length=0; atoms.obstacles.length=0; atoms.particles.length=0; atoms.sparks.length=0;
    for(let i=0;i<16;i++) spawnCoin(true);
    for(let i=0;i<10;i++) spawnObstacle(true);

    initBg();
    updateUI();

    stateTxt.textContent = "آماده";
    modal.classList.add('show');
    restartBtn.style.display='none';
  }

  function updateUI(){
    scoreEl.textContent = game.score;
    coinsEl.textContent = game.coins;
    levelEl.textContent = game.level;
    hpEl.textContent = game.hp;

    const {cur,total} = game.progress();
    progTxt.textContent = `${cur}/${total}`;
    progBar.style.width = total ? ((cur/total)*100).toFixed(1)+'%' : '0%';
  }

  // Input
  const keys = {a:false,d:false,space:false};
  function jumpPress(){
    if(!running) return;
    player.spaceRequested = true;
  }

  window.addEventListener('keydown', (e)=>{
    if(e.code==='KeyA') keys.a=true;
    if(e.code==='KeyD') keys.d=true;
    if(e.code==='Space'){ keys.space=true; if(!running) return; e.preventDefault(); jumpPress(); }
  }, {passive:false});

  window.addEventListener('keyup', (e)=>{
    if(e.code==='KeyA') keys.a=false;
    if(e.code==='KeyD') keys.d=false;
    if(e.code==='Space') keys.space=false;
  });

  window.addEventListener('mousemove', (e)=>{
    if(!running) return;
    player.targetX = clamp(e.clientX, 0, W);
  }, {passive:true});

  window.addEventListener('touchstart', (e)=>{
    if(!running) return;
    const t = e.touches && e.touches[0];
    if(t) player.targetX = clamp(t.clientX, 0, W);
    e.preventDefault();
    // تپ صفحه = پرش (اگر کاربر انگشت رو خیلی کوتاه نگه داره)
    // اینجا ساده: اگر کاربر روی صفحه تپ کرد، پرش انجام می‌دیم
    jumpPress();
  }, {passive:false});

  window.addEventListener('touchmove', (e)=>{
    if(!running) return;
    const t = e.touches && e.touches[0];
    if(t) player.targetX = clamp(t.clientX, 0, W);
    e.preventDefault();
  }, {passive:false});

  jumpBtn.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    jumpPress();
  }, {passive:false});
  jumpBtn.addEventListener('mousedown', (e)=>{
    e.preventDefault();
    jumpPress();
  });

  // Start button (fix اصلی)
  function startGame(){
    modal.classList.remove('show');
    restartBtn.style.display='none';
    resetWorldOnly();
    running = true;
    stateTxt.textContent = "در حال اجرا...";
  }

  function resetWorldOnly(){
    // فقط دوباره دنیارو بساز بدون اینکه modal برگرده
    game.time=0; game.score=0; game.coins=0; game.level=1; game.hp=3; game.speed=220;
    player.x=W/2; player.y=H*0.72;
    player.vx=0; player.vy=0; player.targetX=player.x;
    player.onGround=true; player.invuln=0; player.jumpCooldown=0;
    player.spaceRequested=false;
    atoms.coins.length=0; atoms.obstacles.length=0; atoms.particles.length=0; atoms.sparks.length=0;
    for(let i=0;i<16;i++) spawnCoin(true);
    for(let i=0;i<10;i++) spawnObstacle(true);
    initBg();
    updateUI();
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', ()=>{
    modal.classList.remove('show');
    startGame();
    restartBtn.style.display='none';
  });

  // Collision helpers
  function circleRectHit(cx,cy,cr, rx,ry, rw,rh){
    const left=rx-rw/2, right=rx+rw/2;
    const top=ry-rh/2, bottom=ry+rh/2;
    const nx=clamp(cx,left,right);
    const ny=clamp(cy,top,bottom);
    const dx=cx-nx, dy=cy-ny;
    return dx*dx+dy*dy <= cr*cr;
  }

  function lose(){
    if(player.invuln>0) return;
    game.hp--;
    player.invuln = 1.2;
    stateTxt.textContent = "برخورد!";
    if(game.hp<=0){
      running = false;
      stateTxt.textContent = "بازی تمام شد";
      modal.classList.add('show');
      restartBtn.style.display='inline-block';
    }
  }

  function nextLevel(){
    game.level++;
    game.speed = 220 + (game.level-1)*34;
    for(let i=0;i<10;i++) spawnCoin();
    for(let i=0;i<8;i++) spawnObstacle();
    player.invuln = 0.8;
    stateTxt.textContent = `لول ${game.level}`;
  }

  // Draw
  function drawBackground(){
    ctx.fillStyle='rgba(0,0,0,.26)';
    ctx.fillRect(0,0,W,H);

    // radial blobs
    const g = ctx.createRadialGradient(W*0.25, H*0.15, 50, W*0.25, H*0.15, Math.max(W,H)*0.9);
    g.addColorStop(0,'rgba(124,92,255,.18)');
    g.addColorStop(0.35,'rgba(124,92,255,.06)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    const g2 = ctx.createRadialGradient(W*0.85, H*0.25, 50, W*0.85, H*0.25, Math.max(W,H)*0.9);
    g2.addColorStop(0,'rgba(25,211,255,.16)');
    g2.addColorStop(0.35,'rgba(25,211,255,.05)');
    g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);

    // grid
    const horizon = H*0.2 + Math.sin(game.time*0.6)*6;
    ctx.save();
    ctx.globalAlpha = 0.18;
    for(let i=0;i<22;i++){
      const t=i/21;
      const y=lerp(horizon,H*0.92,t);
      const c=(i%3===0)?'rgba(124,92,255,.16)':(i%3===1?'rgba(25,211,255,.14)':'rgba(46,229,157,.10)');
      glowLine(-10,y,W+10,y,c,1.1);
    }
    ctx.restore();

    for(const s of bg.stars){
      ctx.save();
      ctx.globalAlpha=s.a;
      const col = s.hue===260 ? 'rgba(124,92,255,.95)' : 'rgba(25,211,255,.95)';
      ctx.fillStyle=col;
      ctx.shadowColor=col;
      ctx.shadowBlur=14;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(){
    drawBackground();

    // coins
    for(const c of atoms.coins){
      if(!c.alive) continue;
      const pulse = 0.6 + 0.4*Math.sin(game.time*3 + c.wob);
      const r = c.r*(0.9+0.12*pulse);
      const outer = c.hue===260 ? `hsla(260,100%,70%,${0.9*pulse})` : `hsla(195,100%,70%,${0.9*pulse})`;
      const inner = c.hue===260 ? 'rgba(124,92,255,.25)' : 'rgba(25,211,255,.25)';
      ctx.save();
      ctx.translate(c.x,c.y);
      ctx.rotate(c.rot + Math.sin(game.time*2+c.wob)*0.2);
      ctx.shadowBlur = 26;
      ctx.shadowColor = outer;
      // ring
      ctx.strokeStyle = outer;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0,0,r,0,Math.PI*2);
      ctx.stroke();
      neonCircle(0,0,r*0.95, outer, inner);
      ctx.restore();
    }

    // obstacles
    for(const o of atoms.obstacles){
      if(!o.alive) continue;
      const t=game.time*2 + o.phase;
      const wob=Math.sin(t)*6;
      const x=o.x + wob*0.35, y=o.y;

      ctx.save();
      ctx.translate(x,y);
      const gg = ctx.createLinearGradient(0,-o.h/2,o.w,o.h/2);
      gg.addColorStop(0,'rgba(255,77,109,.30)');
      gg.addColorStop(0.5,'rgba(124,92,255,.22)');
      gg.addColorStop(1,'rgba(25,211,255,.18)');
      ctx.fillStyle=gg;
      ctx.strokeStyle='rgba(255,77,109,.85)';
      ctx.lineWidth=2;
      ctx.shadowColor='rgba(255,77,109,.85)';
      ctx.shadowBlur=28;

      if(o.kind==="bar"){
        const w=o.w,h=o.h,r=10;
        ctx.beginPath();
        ctx.moveTo(-w/2+r,-h/2);
        ctx.arcTo(w/2,-h/2,w/2,h/2,r);
        ctx.arcTo(w/2,h/2,-w/2,h/2,r);
        ctx.arcTo(-w/2,h/2,-w/2,-h/2,r);
        ctx.arcTo(-w/2,-h/2,w/2,-h/2,r);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        for(let i=-2;i<=2;i++){
          glowLine(-o.w/2,(i*8), o.w/2,(i*8)+o.h*0.1,'rgba(124,92,255,.65)',1);
        }
      }else{
        const w=o.w,h=o.h,rr=10;
        ctx.beginPath();
        ctx.moveTo(-w/2+rr,-h/2);
        ctx.arcTo(w/2,-h/2,w/2,h/2,rr);
        ctx.arcTo(w/2,h/2,-w/2,h/2,rr);
        ctx.arcTo(-w/2,h/2,-w/2,-h/2,rr);
        ctx.arcTo(-w/2,-h/2,w/2,-h/2,rr);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        glowLine(-w/2,-h/2,w/2,h/2,'rgba(255,77,109,.65)',2);
        glowLine( w/2,-h/2,-w/2,h/2,'rgba(25,211,255,.55)',2);
      }
      ctx.restore();
    }

    // player
    ctx.save();
    const inv = player.invuln>0;
    ctx.globalAlpha = inv ? 0.5+0.5*Math.sin(game.time*20)*0.7 : 1;
    const pr = player.r*(1+0.06*Math.sin(game.time*6));
    const pcol='rgba(25,211,255,.95)';
    const scol='rgba(124,92,255,.85)';

    // shadow
    ctx.globalAlpha = inv ? 0.18 : 0.25;
    ctx.fillStyle='rgba(0,0,0,.8)';
    ctx.beginPath();
    ctx.ellipse(player.x, player.y+pr*1.25, pr*1.1, pr*0.55, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.globalAlpha = inv ? 0.85 : 1;
    neonCircle(player.x, player.y, pr, pcol, `rgba(124,92,255,.25)`);
    glowLine(player.x-pr*0.35, player.y-pr*0.05, player.x+pr*0.35, player.y-pr*0.05,'rgba(234,240,255,.65)',2);

    // thruster
    if(Math.abs(player.vx)>20){
      for(let i=0;i<3;i++){
        const rr=pr*(0.35+i*0.12);
        const dy=player.y + pr*(0.35+i*0.08);
        glowLine(player.x-rr*0.2,dy, player.x+rr*0.05,dy+rand(10,18),'rgba(46,229,157,.5)',1);
      }
    }
    ctx.restore();
  }

  function update(dt){
    game.time += dt;
    game.speed = 220 + (game.level-1)*34;

    // animate stars
    for(const s of bg.stars){
      s.x += s.vx*dt*60;
      s.y += (s.vy*(game.speed/220))*dt*60;
      if(s.y>H+10){ s.y=-10; s.x=rand(0,W); s.vx=rand(-0.15,0.15); }
      if(s.x< -10) s.x=W+10;
      if(s.x> W+10) s.x=-10;
    }

    // controls
    const moveX = (keys.a?-1:0) + (keys.d?1:0);
    let ax = 0;
    if(moveX!==0) ax = moveX*player.moveSpeed;
    else ax = (player.targetX - player.x)*10;

    player.vx = lerp(player.vx, ax, clamp(dt*10,0,1));

    // jump
    const wantsJump = !!player.spaceRequested || keys.space;
    if(player.jumpCooldown>0) player.jumpCooldown -= dt;

    const g=1350;
    player.vy += g*dt;

    if(wantsJump && player.onGround && player.jumpCooldown<=0){
      player.vy = -player.jumpForce;
      player.onGround=false;
      player.jumpCooldown=0.33;
      player.spaceRequested=false;
    }
    player.spaceRequested=false;

    // integrate
    player.x += player.vx*dt;
    player.y += player.vy*dt;

    player.x = clamp(player.x, 18, W-18);

    const floor = H*0.82;
    if(player.y>floor){
      player.y=floor; player.vy=0; player.onGround=true;
    }

    if(player.invuln>0) player.invuln -= dt;

    // move world downward
    const scroll = (game.speed + game.level*22)*dt;
    for(const c of atoms.coins){
      if(!c.alive) continue;
      c.y += scroll*(0.95 + (c.r/12)*0.08);
      if(c.y>H+60) c.alive=false;

      // coin collide
      const dx=c.x-player.x, dy=c.y-player.y;
      if(dx*dx+dy*dy <= (c.r+player.r*0.9)**2){
        c.alive=false;
        game.score += 10;
        game.coins += 1;
        updateUI();
        if(game.coins>0 && (game.coins % game.needCoins())===0) nextLevel();
      }
    }

    for(const o of atoms.obstacles){
      if(!o.alive) continue;
      o.y += scroll*(1.0 + (o.w/60)*0.25);
      if(o.y>H+80) o.alive=false;

      if(circleRectHit(player.x,player.y,player.r, o.x,o.y, o.w,o.h)){
        lose();
        // knockback
        player.vx *= 0.2;
      }
    }

    // spawn to keep flow
    const needMoreCoins = atoms.coins.filter(x=>x.alive).length < 18 + game.level*2;
    if(needMoreCoins) spawnCoin();

    const needMoreObs = atoms.obstacles.filter(x=>x.alive).length < 12 + game.level*1.3;
    if(needMoreObs) spawnObstacle();
  }

  function loop(t){
    const dt = Math.min(0.033, (t-lastT)/1000 || 0);
    lastT = t;

    if(running) update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  reset();
  modal.classList.add('show');
  requestAnimationFrame((t)=>{ lastT=t; loop(t); });
})();
</script>
</body>
</html>
