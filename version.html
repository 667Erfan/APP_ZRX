<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ساخت فایل BAT اجرای ماینکرفت با لانچر دلخواه</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#121212; color:#eee; padding:20px; max-width:480px; margin:auto; }
  h1 { text-align:center; margin-bottom:24px; }
  label, input, button { display:block; width:100%; margin-bottom:12px; }
  input, button { padding:10px; font-size:16px; border-radius:8px; border:none; outline:none; background:#222; color:#eee; }
  button { background:#0ff; color:#000; font-weight:bold; cursor:pointer; transition:0.3s; }
  button:hover { background:#0cc; }
  .note { font-size:12px; color:#666; text-align:center; margin-top:10px; }
</style>
</head>
<body>

<h1>ساخت فایل BAT اجرای ماینکرفت با لانچر دلخواه</h1>

<label for="launcherPath">مسیر کامل فایل اجرایی لانچر (مثلا TLauncher.exe):</label>
<input type="text" id="launcherPath" placeholder="مثلا C:\Users\DELL\AppData\Roaming\.minecraft\TLauncher.exe" />

<button id="downloadBtn" disabled>ساخت و دانلود فایل BAT</button>

<div class="note" id="infoText">لطفا مسیر فایل لانچر را وارد کنید.</div>

<script>
  const launcherPathInput = document.getElementById('launcherPath');
  const downloadBtn = document.getElementById('downloadBtn');
  const infoText = document.getElementById('infoText');

  launcherPathInput.addEventListener('input', () => {
    if(launcherPathInput.value.trim().length > 0){
      downloadBtn.disabled = false;
      infoText.textContent = 'آماده ساخت فایل BAT.';
    } else {
      downloadBtn.disabled = true;
      infoText.textContent = 'لطفا مسیر فایل لانچر را وارد کنید.';
    }
  });

  downloadBtn.addEventListener('click', () => {
    const path = launcherPathInput.value.trim();
    if(!path){
      alert('لطفا مسیر فایل لانچر را وارد کنید.');
      return;
    }

    const batContent = `@echo off
REM اجرای لانچر ماینکرفت
start "" "${path}"
exit
`;

    const blob = new Blob([batContent], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `Launch_Minecraft_Launcher.bat`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    infoText.textContent = 'فایل BAT ساخته و آماده دانلود شد. آن را اجرا کنید.';
  });
</script>

</body>
</html>
