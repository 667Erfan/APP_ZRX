<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>انتخاب نسخه ماینکرفت و اجرای نسخه روی ویندوز</title>
<style>
  body {
    font-family: Tahoma, Arial, sans-serif;
    background:#121212;
    color:#eee;
    padding: 20px;
    max-width: 480px;
    margin: auto;
  }
  h1 {
    text-align: center;
    margin-bottom: 24px;
  }
  label {
    display: block;
    margin: 14px 0 6px 0;
    font-weight: bold;
  }
  select, button {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #222;
    color: #eee;
    cursor: pointer;
    box-sizing: border-box;
  }
  button {
    margin-top: 24px;
    background: #0ff;
    color: #000;
    font-weight: bold;
    transition: background-color 0.3s ease;
  }
  button:hover:not(:disabled) {
    background: #0cc;
  }
  button:disabled {
    background: #555;
    cursor: not-allowed;
  }
  .info {
    margin-top: 14px;
    font-size: 14px;
    color: #aaa;
    text-align: center;
  }
  .note {
    font-size: 12px;
    color: #666;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>انتخاب نسخه ماینکرفت و اجرای آن (ویندوز)</h1>

<label for="launcherSelect">انتخاب لانچر:</label>
<select id="launcherSelect" aria-label="انتخاب لانچر ماینکرفت">
  <option value="">-- انتخاب کنید --</option>
  <option value="forge">Forge</option>
  <option value="optifine">OptiFine</option>
  <option value="fabric">Fabric</option>
</select>

<label for="versionSelect" id="versionLabel" style="display:none;">انتخاب نسخه:</label>
<select id="versionSelect" style="display:none;" aria-label="انتخاب نسخه ماینکرفت"></select>

<button id="downloadBtn" disabled>دانلود و اجرای نسخه (فایل BAT)</button>

<div class="info" id="infoText"></div>
<div class="note">
  <p>پس از دانلود، فایل را اجرا کنید تا ماینکرفت با نسخه انتخابی باز شود.</p>
  <p>توجه: این روش فقط روی ویندوز و در صورتی که لانچر ماینکرفت در مسیر پیش‌فرض باشد، کار می‌کند.</p>
</div>

<script>
  const launcherSelect = document.getElementById('launcherSelect');
  const versionSelect = document.getElementById('versionSelect');
  const versionLabel = document.getElementById('versionLabel');
  const downloadBtn = document.getElementById('downloadBtn');
  const infoText = document.getElementById('infoText');

  function generateVersions() {
    const versions = [];
    versions.push('1.8.9');
    const knownVersions = [
      '1.9', '1.9.4',
      '1.10', '1.11', '1.11.2',
      '1.12', '1.12.1', '1.12.2'
    ];
    versions.push(...knownVersions);
    for(let major=13; major<=26; major++){
      versions.push(`1.${major}`);
      if(major === 16) versions.push('1.16.5');
      if(major === 17) versions.push('1.17.1');
      if(major === 18) versions.push('1.18.2');
      if(major === 19){
        versions.push('1.19.1');
        versions.push('1.19.2');
        versions.push('1.19.3');
      }
      if(major === 20) versions.push('1.20.1');
      if(major === 26) versions.push('1.26.1');
    }
    return versions;
  }

  const allVersions = generateVersions();

  launcherSelect.addEventListener('change', () => {
    const launcher = launcherSelect.value;
    if(!launcher){
      versionSelect.style.display = 'none';
      versionLabel.style.display = 'none';
      downloadBtn.disabled = true;
      infoText.textContent = '';
      versionSelect.innerHTML = '';
      return;
    }
    versionSelect.style.display = 'block';
    versionLabel.style.display = 'block';

    let filteredVersions = [];
    if(launcher === 'optifine'){
      filteredVersions = allVersions.filter(v => {
        const parts = v.split('.');
        if(parts.length === 3){
          const major = parseInt(parts[1],10);
          const patch = parseInt(parts[2],10);
          if(major < 20) return true;
          if(major === 20 && patch <= 1) return true;
          return false;
        } else if(parts.length === 2){
          const major = parseInt(parts[1],10);
          return major <= 20;
        }
        return false;
      });
    } else {
      filteredVersions = [...allVersions];
    }

    versionSelect.innerHTML = '';
    filteredVersions.forEach(ver => {
      const opt = document.createElement('option');
      opt.value = ver;
      opt.textContent = ver;
      versionSelect.appendChild(opt);
    });

    versionSelect.selectedIndex = 0;
    downloadBtn.disabled = false;
    infoText.textContent = `شما لانچر "${launcher.charAt(0).toUpperCase() + launcher.slice(1)}" را انتخاب کردید. لطفا نسخه را انتخاب کنید.`;
  });

  // تولید محتوای فایل BAT داینامیک
  function generateBatContent(launcher, version){
    // مسیر لانچر ماینکرفت رسمی پیش‌فرض ویندوز:
    // %AppData%\.minecraft\launcher.exe یا لانچر جدید ممکنه مسیر متفاوت داشته باشه
    // ما از فرض مسیر لانچر رسمی در مسیر پیش‌فرض استفاده می‌کنیم.
    // دستور اجرای لانچر با نسخه خاص (اگر لانچر مایکروسافت باشد، ممکن است پارامترها متفاوت باشد)
    // اینجا نمونه ساده با دستور فرضی:
    // "start "" "C:\Program Files (x86)\Minecraft Launcher\MinecraftLauncher.exe" --version 1.16.5"
    // چون پارامتر رسمی لانچر ماینکرفت برای اجرا با نسخه خاص وجود ندارد، این یک نمونه فرضی است.

    // شما باید مسیر لانچر را به مسیر واقعی سیستم خودتان تغییر دهید.
    // یا از لانچرهای سفارشی استفاده کنید که پارامتر نسخه را قبول کنند.

    // نمونه محتوای bat:
    return `@echo off
REM اجرای لانچر ماینکرفت با نسخه ${version} و لانچر ${launcher}
start "" "%LocalAppData%\\Programs\\Minecraft Launcher\\MinecraftLauncher.exe" --workDir "%APPDATA%\\.minecraft" --version ${version}
exit
`;
  }

  downloadBtn.addEventListener('click', () => {
    const launcher = launcherSelect.value;
    const version = versionSelect.value;
    if(!launcher || !version){
      alert('لطفا ابتدا لانچر و نسخه را انتخاب کنید.');
      return;
    }

    const batContent = generateBatContent(launcher, version);

    // ساخت فایل blob و دانلود آن
    const blob = new Blob([batContent], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `Launch_Minecraft_${version}_${launcher}.bat`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    infoText.textContent = `فایل BAT نسخه ${version} برای لانچر ${launcher} ساخته و دانلود شد. آن را اجرا کنید.`;
  });
</script>

</body>
</html>
