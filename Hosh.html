<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Groq Chat UI</title>
  <style>
    body{font-family:Tahoma,Arial; margin:0; background:#0b1020; color:#eaf0ff; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:18px;}
    .card{width:min(900px,100%); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:14px; box-shadow:0 20px 80px rgba(0,0,0,.45);}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    label{font-size:12px; color:rgba(234,240,255,.7)}
    input, textarea{width:100%; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.18); color:inherit; outline:none;}
    textarea{height:110px; resize:none;}
    button{border:none; border-radius:12px; padding:12px 16px; font-weight:900; cursor:pointer; color:#071018;
      background:linear-gradient(135deg,#7c5cff,#19d3ff); box-shadow:0 14px 30px rgba(124,92,255,.25);}
    #chat{height:55vh; overflow:auto; padding:10px; border-radius:14px; border:1px solid rgba(255,255,255,.10); background:rgba(0,0,0,.16); margin-top:10px;}
    .msg{margin:10px 0; display:flex;}
    .bubble{max-width:78%; padding:12px; border-radius:14px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06); white-space:pre-wrap; line-height:1.7; font-size:14px;}
    .user{justify-content:flex-start;}
    .user .bubble{background:linear-gradient(180deg, rgba(124,92,255,.22), rgba(124,92,255,.08)); border-color:rgba(124,92,255,.38);}
    .ai{justify-content:flex-end;}
    .ai .bubble{background:linear-gradient(180deg, rgba(25,211,255,.18), rgba(25,211,255,.06)); border-color:rgba(25,211,255,.28);}
    .pillbar{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
    .pill{padding:8px 10px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:999px; cursor:pointer; font-weight:800; color:inherit;}
    .small{color:rgba(234,240,255,.7); font-size:12px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div style="flex:1; min-width:260px;">
        <label>endpoint(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)</label>
        <input id="endpoint" value="http://localhost:3000/api/chat" />
        <div class="small" style="margin-top:6px;">مثال: http://localhost:3000/api/chat</div>
      </div>
    </div>

    <div id="chat"></div>

    <div class="row" style="margin-top:10px;">
      <textarea id="input" placeholder="پیامت رو اینجا بنویس..."></textarea>
    </div>

    <div class="row" style="margin-top:10px; justify-content:space-between;">
      <div class="pillbar">
        <button class="pill" onclick="setQuick('سلام!')">سلام</button>
        <button class="pill" onclick="setQuick('یه جوک بگو')">جوک</button>
        <button class="pill" onclick="setQuick('راهنمایی کن برای ساخت پروژه')">کمک</button>
      </div>
      <button onclick="send()">ارسال</button>
    </div>
  </div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const endpointEl = document.getElementById("endpoint");

  function add(role, text){
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role==="user" ? "user" : "ai");
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    wrap.appendChild(b);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function setQuick(t){
    input.value = t;
    input.focus();
  }

  async function send(){
    const text = input.value.trim();
    if(!text) return;

    add("user", text);
    input.value = "";

    const endpoint = endpointEl.value.trim();
    add("ai", "در حال پردازش...");

    const last = chat.lastChild;
    try{
      const res = await fetch(endpoint, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ message: text, language: "fa" })
      });
      const data = await res.json().catch(()=> ({}));
      const reply = res.ok ? (data.reply ?? "") : (data.error ?? "خطا");
      last.querySelector(".bubble").textContent = reply || "پاسخی دریافت نشد.";
    }catch(e){
      last.querySelector(".bubble").textContent = "اتصال برقرار نشد. endpoint را چک کن.";
    }
  }

  input.addEventListener("keydown", (e)=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });

  add("ai", "سلام! endpoint رو پیست کن و پیام بفرست.");
</script>
</body>
</html>
