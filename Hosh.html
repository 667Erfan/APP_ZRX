<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سازنده تصویر</title>
  <style>
    body{font-family:sans-serif;margin:20px}
    textarea{width:100%;height:110px;padding:10px;font-size:16px}
    button{padding:10px 14px;font-size:16px;cursor:pointer}
    .log{margin-top:12px;border:1px solid #ddd;border-radius:10px;padding:12px;min-height:90px}
    .log div{margin:6px 0}
    img{max-width:100%;margin-top:14px;border-radius:10px;border:1px solid #ddd;padding:10px;display:none}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  </style>
</head>
<body>
  <h2>ساخت تصویر (همان صفحه)</h2>

  <textarea id="prompt" placeholder="متن عکس..."></textarea>

  <div class="row">
    <button id="btn">ساخت تصویر</button>
    <span id="status"></span>
  </div>

  <div class="log" id="log"></div>
  <img id="out" alt="output" />

  <script>
    const btn = document.getElementById("btn");
    const promptEl = document.getElementById("prompt");
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const add = (t) => {
      const d = document.createElement("div");
      d.textContent = t;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    };

    btn.addEventListener("click", async () => {
      const prompt = (promptEl.value || "").trim();
      if (!prompt) return statusEl.textContent = "Prompt وارد کن.";

      btn.disabled = true;
      statusEl.textContent = "در حال ساخت...";
      logEl.innerHTML = "";
      outEl.style.display = "none";
      outEl.src = "";

      add("مانتو رفت تو سایت...");
      await sleep(600);
      add("مرد وارد شد...");
      await sleep(600);
      add("متن عکس: " + prompt);
      await sleep(600);
      add("ساخت تصویر...");
      await sleep(400);

      // این endpoint باید در backend ساخته بشه (بدون اینکه کاربر سایت ثالثی ببینه)
      const res = await fetch("/generate-image", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ prompt })
      });

      if (!res.ok) {
        const msg = await res.text();
        statusEl.textContent = "خطا: " + msg;
        btn.disabled = false;
        return;
      }

      const data = await res.json();
      // انتظار: { imageUrl: "..." } یا { imageBase64: "..." }
      if (data.imageUrl) {
        outEl.src = data.imageUrl;
      } else if (data.imageBase64) {
        outEl.src = "data:image/png;base64," + data.imageBase64;
      } else {
        statusEl.textContent = "خروجی برنگشت.";
        btn.disabled = false;
        return;
      }

      outEl.style.display = "block";
      statusEl.textContent = "انجام شد ✅";
      add("انجام شد ✅");
      btn.disabled = false;
    });
  </script>
</body>
</html>
