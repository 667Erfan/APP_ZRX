<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سازنده تصویر (بدون API)</title>
  <style>
    body{font-family:sans-serif;margin:20px}
    textarea{width:100%;height:120px;padding:10px;font-size:16px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
    select,button{padding:10px 12px;font-size:16px}
    button{cursor:pointer}
    .box{margin-top:14px;color:#333}
  </style>
</head>
<body>
  <h2>تولید تصویر (بدون کلید API)</h2>

  <label>Prompt</label>
  <textarea id="prompt" placeholder="مثلاً: یک ربات دوست‌داشتنی با پس‌زمینه نئون"></textarea>

  <div class="row">
    <label>سبک/سایز:</label>
    <select id="opt">
      <option value="square">مربعی</option>
      <option value="portrait">عمودی</option>
      <option value="landscape">افقی</option>
    </select>
    <button id="go">ساخت تصویر</button>
  </div>

  <div class="box" id="msg"></div>

  <script>
    const btn = document.getElementById("go");
    const promptEl = document.getElementById("prompt");
    const optEl = document.getElementById("opt");
    const msg = document.getElementById("msg");

    btn.addEventListener("click", () => {
      const p = (promptEl.value || "").trim();
      if (!p) { msg.textContent = "لطفاً Prompt وارد کن."; return; }
      msg.textContent = "در حال انتقال به سازنده تصویر...";

      // اینجا از یک سازنده عمومی استفاده می‌کنیم و Prompt را با query می‌فرستیم.
      // اگر لینک/پارامترها برای سایت مد نظر تو تغییر کند، بگو تا همون سایت رو دقیق تنظیم کنم.
      const sizeMap = { square: "1024x1024", portrait: "1024x1536", landscape: "1536x1024" };
      const size = sizeMap[optEl.value] || "1024x1024";

      // نمونه لینک (ممکن است برخی سایت‌ها پارامترها را با نام‌های دیگری بگیرند)
      const url = "https://www.bing.com/images/create" +
        "?q=" + encodeURIComponent(p + " --aspect " + size);

      window.open(url, "_blank");
      msg.textContent = "باز شد ✅ (در صفحه جدید تصویر ساخته می‌شود)";
    });
  </script>
</body>
</html>
