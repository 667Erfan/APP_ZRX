<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بخش هوش مصنوعی Zrx</title>
  <style>
    /* تنظیمات پایه */
    body, html {
      height: 100%;
      margin: 0;
      font-family: "Vazirmatn", sans-serif, Tahoma;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      direction: rtl;
    }

    .wrapper {
      background: rgba(0, 0, 0, 0.65);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.7);
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 300px;
      text-align: center;
    }

    button {
      background: linear-gradient(135deg, #00f0ff 0%, #0077ff 100%);
      border: none;
      border-radius: 15px;
      padding: 16px 0;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        0 0 10px #00f0ff,
        0 0 20px #0077ff;
      transition: all 0.3s ease;
      user-select: none;
    }

    button:hover {
      background: linear-gradient(135deg, #0077ff 0%, #00f0ff 100%);
      box-shadow:
        0 0 15px #00f0ff,
        0 0 30px #0077ff;
      transform: scale(1.05);
      color: #fff;
    }

    button:active {
      transform: scale(0.95);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="wrapper" role="main" aria-label="بخش دکمه‌ها">
    <button id="btnChat">گفتگو هوش مصنوعی خصوصی Zrx</button>
    <button id="btnVideo">ساخت ویدیو</button>
    <button id="btnImage">ساخت عکس</button>
    <button id="btnMusic">ساخت موزیک</button>
  </div>
</body>
</html>
