<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>متن → آهنگ</title>
  <style>
    body{font-family:sans-serif;margin:20px}
    textarea{width:100%;height:140px;padding:10px;font-size:16px}
    button{padding:10px 14px;font-size:16px;cursor:pointer;margin-top:10px}
    .box{margin-top:12px;border:1px solid #ddd;border-radius:10px;padding:12px}
    a{display:inline-block;margin-top:10px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .status{margin-top:10px;color:#333}
  </style>
</head>
<body>
  <h2>تبدیل متن به آهنگ (نسخه API)</h2>

  <textarea id="lyrics" placeholder="اینجا متن/لیرکس را بنویس..."></textarea>
  <div class="row">
    <button id="btn">ساخت آهنگ</button>
    <button id="cancel" disabled>لغو/ریست</button>
  </div>

  <div class="status" id="status"></div>
  <div class="box" id="result" style="display:none"></div>

<script>
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const btn = document.getElementById("btn");
const cancelBtn = document.getElementById("cancel");
let ctrl = null;

btn.onclick = async () => {
  const text = document.getElementById("lyrics").value.trim();
  if (!text) return statusEl.textContent = "لطفاً متن را وارد کن.";

  btn.disabled = true;
  cancelBtn.disabled = false;
  resultEl.style.display = "none";
  resultEl.innerHTML = "";
  statusEl.textContent = "در حال ساخت...";

  ctrl = new AbortController();
  try {
    const res = await fetch("/api/text-to-song", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ text }),
      signal: ctrl.signal
    });

    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    // انتظار: { downloadUrl, jobId }
    statusEl.textContent = "آهنگ آماده شد ✅";
    resultEl.style.display = "block";
    resultEl.innerHTML = `
      <div>jobId: <b>${data.jobId || "-"}</b></div>
      <a href="${data.downloadUrl}" download>دانلود آهنگ</a>
    `;
  } catch (e) {
    statusEl.textContent = "خطا: " + (e?.message || e);
  } finally {
    btn.disabled = false;
    cancelBtn.disabled = true;
    ctrl = null;
  }
};

cancelBtn.onclick = () => {
  if (ctrl) ctrl.abort();
  statusEl.textContent = "لغو شد.";
};
</script>
</body>
</html>
