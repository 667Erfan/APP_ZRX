<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat - Zrx_MINE (No Server)</title>
  <style>
    :root{
      --bg1:#050814; --bg2:#0b1433;
      --text:#eaf2ff; --muted:rgba(234,242,255,.75);
      --line:rgba(255,255,255,.14);
      --meBg: rgba(56,189,248,.12);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--text);
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex; flex-direction:column;
    }
    header{
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      background: rgba(0,0,0,.08); backdrop-filter: blur(8px);
    }
    .brand{ display:flex; align-items:center; gap:10px; font-weight:1000; }
    .logo{ width:36px; height:36px; border-radius:14px;
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85));
      display:grid; place-items:center;
      box-shadow: 0 18px 50px rgba(56,189,248,.18), inset 0 0 0 1px rgba(255,255,255,.18);
    }
    header .sub{ color:var(--muted); font-size:12px; font-weight:900; }
    .grid{
      flex:1;
      display:grid;
      grid-template-columns: 320px 1fr;
      gap:14px;
      padding:14px;
      min-height:0;
    }
    @media (max-width:900px){ .grid{ grid-template-columns: 1fr; } }

    .card{
      border:1px solid var(--line);
      border-radius:18px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      min-height:0;
      display:flex; flex-direction:column;
    }
    .left{ padding:14px; gap:12px; }
    .right{ min-height:0; }
    .left .section{ margin-top:6px; }
    .field{ display:flex; flex-direction:column; gap:8px; }
    label{ color:var(--muted); font-size:12px; font-weight:1000; }
    input{
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.15);
      color:var(--text);
      outline:none; font-weight:900;
    }
    input::placeholder{ color: rgba(234,242,255,.45); }
    .btnRow{ display:flex; gap:10px; }
    button{
      flex:1;
      border:0;
      border-radius:14px;
      padding:12px 12px;
      font-weight:1000;
      cursor:pointer;
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85));
      color:#07101b;
      box-shadow: 0 18px 55px rgba(56,189,248,.18), inset 0 0 0 1px rgba(255,255,255,.18);
      user-select:none;
    }
    .ghost{
      background: rgba(255,255,255,.07);
      color:var(--text);
      box-shadow:none;
      border:1px solid rgba(255,255,255,.14);
    }

    .users{
      border-top:1px solid var(--line);
      padding-top:12px;
      display:flex; flex-direction:column; gap:10px;
      overflow:auto;
      max-height: 220px;
    }
    .user{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      font-weight:1000;
    }
    .avatar{
      width:28px;height:28px;border-radius:12px;
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85));
      display:grid; place-items:center;
      color:#07101b;
      flex:0 0 auto;
    }
    .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .messages{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:14px;
      display:flex; flex-direction:column; gap:10px;
    }
    .messages::-webkit-scrollbar{ width:10px; }
    .messages::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.16); border-radius:999px; }

    .row{ display:flex; gap:10px; align-items:flex-end; }
    .row.me{ flex-direction:row-reverse; }
    .bAv{
      width:32px;height:32px;border-radius:14px;
      background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(56,189,248,.85));
      display:grid; place-items:center;
      color:#07101b; font-weight:1000; flex:0 0 auto;
    }
    .bubble{
      max-width:78%;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      border-radius:16px;
      padding:12px 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }
    .bubble.me{ background: var(--meBg); border-color: rgba(56,189,248,.25); }
    .meta{
      display:flex; justify-content:space-between; gap:10px;
      color: rgba(234,242,255,.82);
      font-size:12px; font-weight:1000;
      margin-bottom:6px;
    }
    .text{ white-space:pre-wrap; word-break:break-word; font-weight:900; line-height:1.45; }
    .time{ color: rgba(234,242,255,.55); font-size:11px; font-weight:900; margin-top:6px; }

    .composer{
      border-top:1px solid var(--line);
      padding:12px;
      display:flex; gap:10px;
      background: rgba(0,0,0,.10);
    }
    .composer input{ flex:1; }
    .send{ flex:0 0 130px; }
    .hint{ color:var(--muted); font-size:12px; font-weight:900; line-height:1.7; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">☁️</div>
      <div>
        Chat - Zrx_MINE
        <div class="sub">پخش بین تب‌های همین دستگاه (بدون سرور)</div>
      </div>
    </div>
    <div class="sub" id="status">آماده</div>
  </header>

  <div class="grid">
    <aside class="card left">
      <div class="field">
        <label>اسم نمایشی</label>
        <input id="nameInput" maxlength="24" placeholder="مثلا zrx" />
      </div>

      <div class="btnRow">
        <button id="applyName">عوض کردن اسم</button>
        <button id="clearUI" class="ghost" title="فقط UI همین تب پاک میشه">پاک‌سازی</button>
      </div>

      <div class="section hint">
        پیام‌ها با <b>BroadcastChannel</b> بین تب‌ها پخش میشه.
      </div>

      <div class="users" id="usersList">
        <!-- online users -->
      </div>
    </aside>

    <section class="card right">
      <div class="messages" id="messages"></div>

      <div class="composer">
        <input id="msgInput" type="text" maxlength="220" placeholder="پیام بنویس… (Enter)" />
        <button id="sendBtn" class="send">ارسال</button>
      </div>
    </section>
  </div>

<script>
  // ===== NO SERVER CHAT (TAB-to-TAB) =====
  const channelName = "zrx_cloud_chat_global_v1";
  const bc = new BroadcastChannel(channelName);

  const uidKey = "zrx_local_uid";
  let myUid = localStorage.getItem(uidKey);
  if(!myUid){
    myUid = "u_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
    localStorage.setItem(uidKey, myUid);
  }

  const nameInput = document.getElementById("nameInput");
  const applyName = document.getElementById("applyName");
  const msgInput = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const messagesEl = document.getElementById("messages");
  const usersList = document.getElementById("usersList");
  const statusEl = document.getElementById("status");
  const clearUI = document.getElementById("clearUI");

  let myName = localStorage.getItem("zrx_local_name") || "";
  if(!myName) myName = "zrx";
  nameInput.value = myName;

  // users presence (local tab only)
  const users = new Map(); // uid -> {uid,name,lastSeen}
  users.set(myUid, {uid: myUid, name: myName, lastSeen: Date.now()});

  function avatarLetter(name){
    const s = (name || "").trim();
    return s ? s[0] : "U";
  }
  function fmtTime(ts){
    try{
      const d = new Date(ts);
      return d.toLocaleTimeString("fa-IR", {hour:"2-digit", minute:"2-digit"});
    }catch{ return ""; }
  }
  function escapeHtml(str){
    return (str ?? "").toString().replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function renderSystem(text){
    const div = document.createElement("div");
    div.style.alignSelf = "center";
    div.style.textAlign = "center";
    div.style.border = "1px dashed rgba(255,255,255,.18)";
    div.style.background = "rgba(255,255,255,.05)";
    div.style.padding = "10px 14px";
    div.style.borderRadius = "999px";
    div.style.color = "rgba(234,242,255,.85)";
    div.style.fontWeight = "1000";
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderMessage(m){
    if(m.type === "system"){
      renderSystem(m.text || "");
      return;
    }
    const row = document.createElement("div");
    row.className = "row" + (m.uid === myUid ? " me" : "");

    const av = document.createElement("div");
    av.className = "bAv";
    av.textContent = avatarLetter(m.name);

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (m.uid === myUid ? " me" : "");

    const meta = document.createElement("div");
    meta.className = "meta";

    const left = document.createElement("div");
    left.textContent = m.name || "Unknown";

    const right = document.createElement("div");
    right.textContent = "";

    meta.appendChild(left);
    meta.appendChild(right);

    const text = document.createElement("div");
    text.className = "text";
    text.textContent = m.text || "";

    const time = document.createElement("div");
    time.className = "time";
    time.textContent = m.createdAt ? fmtTime(m.createdAt) : "";

    bubble.appendChild(meta);
    bubble.appendChild(text);
    bubble.appendChild(time);

    row.appendChild(av);
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderUsers(){
    // remove stale (not necessary but feels better)
    const now = Date.now();
    for(const [uid,u] of users.entries()){
      if(now - u.lastSeen > 20000) users.delete(uid);
    }

    const arr = Array.from(users.values());
    arr.sort((a,b)=> (a.name||"").localeCompare(b.name||"","fa"));

    usersList.innerHTML = "";
    for(const u of arr){
      const div = document.createElement("div");
      div.className = "user";

      const left = document.createElement("div");
      left.style.display = "flex";
      left.style.alignItems = "center";
      left.style.gap = "10px";

      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = avatarLetter(u.name);

      const nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = u.name || "Unknown";

      left.appendChild(av);
      left.appendChild(nm);

      const tag = document.createElement("div");
      tag.style.color = "rgba(234,242,255,.72)";
      tag.style.fontSize = "12px";
      tag.style.fontWeight = "1000";
      tag.textContent = (u.uid === myUid) ? "تو" : "آنلاین";

      div.appendChild(left);
      div.appendChild(tag);

      usersList.appendChild(div);
    }
  }

  // presence ping
  function broadcastPresence(){
    const payload = {type:"presence", uid: myUid, name: myName, at: Date.now()};
    bc.postMessage(payload);
  }

  // on receive
  bc.onmessage = (ev)=>{
    const msg = ev.data || {};
    if(msg.type === "presence"){
      users.set(msg.uid, {uid: msg.uid, name: msg.name, lastSeen: msg.at || Date.now()});
      renderUsers();
      return;
    }

    if(msg.type === "rename"){
      // update sender name locally (UI)
      users.set(msg.uid, {uid: msg.uid, name: msg.name, lastSeen: Date.now()});
      renderUsers();
      renderMessage({type:"system", text: msg.text, createdAt: msg.at || Date.now()});
      return;
    }

    if(msg.type === "chat" || msg.type === "system"){
      renderMessage(msg);
      return;
    }
  };

  // announce join
  statusEl.textContent = "اتصال محلی...";
  bc.postMessage({type:"system", uid: myUid, name: myName, text: `${myName} وارد شد. دور هم جم میشیم 😈`, createdAt: Date.now()});
  bc.postMessage({type:"presence", uid: myUid, name: myName, at: Date.now()});
  renderUsers();

  // periodic presence
  setInterval(broadcastPresence, 5000);

  function sendMessage(){
    const t = (msgInput.value || "").trim();
    if(!t) return;
    bc.postMessage({
      type:"chat",
      uid: myUid,
      name: myName,
      text: t,
      createdAt: Date.now()
    });
    msgInput.value = "";
    msgInput.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter") sendMessage();
  });

  applyName.addEventListener("click", ()=>{
    const newName = (nameInput.value || "").trim().slice(0,24) || "zrx";
    const oldName = myName;
    if(newName === oldName) return;

    myName = newName;
    localStorage.setItem("zrx_local_name", myName);

    users.set(myUid, {uid: myUid, name: myName, lastSeen: Date.now()});
    renderUsers();
    broadcastPresence();

    bc.postMessage({
      type:"rename",
      uid: myUid,
      name: myName,
      text: `اسم عوض شد: ${oldName} → ${myName} 🔥`,
      at: Date.now()
    });
    statusEl.textContent = "اسم ذخیره شد ✅";
    setTimeout(()=> statusEl.textContent = "آنلاین", 1200);
  });

  clearUI.addEventListener("click", ()=>{
    messagesEl.innerHTML = "";
  });

  // seed initial system
  renderSystem("دور هم جم شدیم… خفن حرف بزن 😈");
</script>
</body>
</html>
