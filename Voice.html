<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Voice Room - بدون باگ</title>
  <style>
    body{
      margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:#0b1220; color:#e5e7eb;
      display:flex; justify-content:center; padding:24px;
    }
    .app{ width:min(900px, 100%); }
    .card{
      background:#0f1a2f; border:1px solid rgba(255,255,255,.08);
      border-radius:14px; overflow:hidden;
    }
    header{
      padding:14px 16px; background:linear-gradient(90deg, rgba(99,102,241,.25), rgba(34,211,238,.15));
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex; justify-content:space-between; align-items:center; gap:12px;
    }
    .title{ font-weight:900; }
    .pill{
      font-size:12px; padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.15);
      color:#c7d2fe; background:rgba(99,102,241,.08); white-space:nowrap;
    }
    .content{ padding:16px; display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .panel{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:14px;
    }
    label{ display:block; font-size:12px; color:#b6c2d9; margin-bottom:8px; }
    input{
      width:100%; padding:11px 12px; border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:#0b1220; color:#e5e7eb; outline:none;
    }
    input:focus{
      border-color: rgba(99,102,241,.65);
      box-shadow:0 0 0 4px rgba(99,102,241,.18);
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    button{
      border:0; cursor:pointer; border-radius:12px;
      padding:11px 14px; font-weight:900;
      background:#4f46e5; color:#fff;
      transition:transform .05s ease, filter .15s ease;
    }
    button.secondary{ background:#1f2a44; border:1px solid rgba(255,255,255,.12); }
    button.danger{ background:#dc2626; }
    button:disabled{ opacity:.55; cursor:not-allowed; }
    .status{ margin-top:10px; font-size:13px; color:#cbd5e1; line-height:1.7; min-height:44px; }
    .chat{
      height:360px; overflow:auto; padding:12px;
      background:#0b1220; border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
    }
    .msg{ margin:10px 0; display:flex; }
    .msg.user{ justify-content:flex-start; }
    .msg.bot{ justify-content:flex-end; }
    .bubble{
      max-width:85%;
      padding:10px 12px; border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      white-space:pre-wrap; word-wrap:break-word; line-height:1.6;
      font-size:14px;
    }
    .msg.user .bubble{
      background:rgba(99,102,241,.18); border-color:rgba(99,102,241,.35);
    }
    .msg.bot .bubble{
      background:rgba(34,211,238,.14); border-color:rgba(34,211,238,.28);
    }
    .small{ font-size:12px; color:#94a3b8; line-height:1.7; }
    .log{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:12px; color:#93c5fd;
      background:#050a14; border:1px solid rgba(255,255,255,.06);
      padding:10px; border-radius:12px; margin-top:10px; max-height:120px; overflow:auto;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="card">
    <header>
      <div class="title">Voice Room (میکروفن + ربات)</div>
      <div class="pill" id="envPill">در حال بررسی…</div>
    </header>

    <div class="content">
      <div class="panel">
        <label>نام روم</label>
        <input id="roomInput" value="demo-1"/>

        <div class="row">
          <button id="createBtn">ساخت روم</button>
          <button id="joinBtn" class="secondary">ورود به روم</button>
        </div>

        <div class="status" id="statusText">ابتدا روم بساز یا وارد شو.</div>

        <div class="row">
          <button id="micBtn" class="secondary" disabled>شروع حرف زدن</button>
          <button id="stopBtn" class="danger" disabled>قطع</button>
          <button id="leaveBtn" class="secondary" disabled>خروج</button>
        </div>

        <div class="small" style="margin-top:10px">
          برای تست: دو تب مرورگر باز کن و هر دو با یک Room Name وارد شو. پیام‌ها بین تب‌ها همزمان می‌شوند.
        </div>

        <div class="log" id="logEl"></div>
      </div>

      <div class="panel">
        <div class="chat" id="chatEl" aria-live="polite"></div>
        <div class="row" style="margin-top:12px;">
          <button id="clearBtn" class="secondary">پاک کردن چت</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logEl = $("logEl");
  const chatEl = $("chatEl");

  let room = null;
  let channel = null;
  let localId = Math.random().toString(16).slice(2);
  let listening = false;
  let recognition = null;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canSTT = !!SpeechRecognition;
  const canTTS = "speechSynthesis" in window;

  $("envPill").textContent =
    (canSTT ? "STT ✅" : "STT ❌") + " " + (canTTS ? "TTS ✅" : "TTS ❌");

  function log(msg){
    const t = new Date().toLocaleTimeString("fa-IR");
    logEl.textContent += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addMsg(text, role){
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function setStatus(msg){ $("statusText").textContent = msg; }

  function speak(text){
    if(!canTTS) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fa-IR";
      u.rate = 1;
      speechSynthesis.speak(u);
    }catch(e){
      log("TTS error: " + e.message);
    }
  }

  function botReply(userText){
    const t = (userText || "").trim().toLowerCase();
    if(t.includes("سلام")) return "سلام دوست عزیزم";
    if(t.includes("خوبی") || t.includes("چطوری") || t.includes("حالت") || (t.includes("خوب") && t.includes("?")))
      return "بله من خوب هستم شما چطور اگر کمکی نیاز دارید من در خدمتم";
    return "حتماً! بگو دقیقاً چه کمکی نیاز داری؟";
  }

  function sendToRoom(type, payload){
    if(!channel) return;
    channel.postMessage({ type, room, from: localId, payload });
  }

  function setupChannel(){
    if(channel) { try{ channel.close(); }catch{} }
    channel = new BroadcastChannel(`voice-room:${room}`);

    channel.onmessage = (e) => {
      const msg = e.data;
      if(!msg || msg.room !== room) return;
      if(msg.from === localId) return;

      if(msg.type === "chat"){
        addMsg(msg.payload.text, msg.payload.role);
        // اگر نقش bot بود، فقط یکی از تب‌ها ممکنه صدا را بزند.
        if(msg.payload.role === "bot") speak(msg.payload.text);
      }
    };
  }

  function pushChat(text, role){
    addMsg(text, role);
    sendToRoom("chat", { text, role });
  }

  async function enterRoom(action){
    room = ($("roomInput").value.trim() || "demo-1");
    setupChannel();

    // UI
    $("leaveBtn").disabled = false;
    $("micBtn").disabled = false;
    $("stopBtn").disabled = true;
    $("createBtn").disabled = false;
    $("joinBtn").disabled = false;

    setStatus(action === "create" ? "روم ساخته شد. شروع حرف زدن کن." : "وارد شدی. شروع حرف زدن کن.");

    log(`Entered room "${room}" (${action})`);

    // سلام اولیه (برای هر تب هم نمایش داده می‌شود)
    pushChat("سلام دوست عزیزم", "bot");
  }

  function leaveRoom(){
    try { if(recognition) recognition.stop(); } catch {}
    listening = false;
    try { if(channel) channel.close(); } catch {}
    channel = null;
    room = null;

    $("micBtn").disabled = true;
    $("stopBtn").disabled = true;
    $("leaveBtn").disabled = true;

    setStatus("ابتدا روم بساز یا وارد شو.");
    log("Left room.");
  }

  function startSTT(){
    if(!canSTT){
      setStatus("SpeechRecognition در این مرورگر پشتیبانی نمی‌شود.");
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "fa-IR";
    recognition.interimResults = true;
    recognition.continuous = true;

    let lastFinal = "";

    recognition.onstart = () => {
      listening = true;
      $("micBtn").disabled = true;
      $("stopBtn").disabled = false;
      setStatus("در حال گوش دادن… حرف بزن.");
      log("STT started.");
    };

    recognition.onerror = (e) => {
      log("STT error: " + (e.error || "unknown"));
      setStatus("خطا: " + (e.error || "نامشخص"));
    };

    recognition.onend = () => {
      listening = false;
      $("micBtn").disabled = false;
      $("stopBtn").disabled = true;
      setStatus("توقف شد. اگر خواستی دوباره شروع کن.");
      log("STT ended.");
    };

    recognition.onresult = (event) => {
      let finalText = "";
      for(let i = event.resultIndex; i < event.results.length; i++){
        const res = event.results[i];
        const txt = res[0]?.transcript || "";
        if(res.isFinal) finalText += txt;
      }

      finalText = finalText.trim();
      if(finalText && finalText !== lastFinal){
        lastFinal = finalText;

        // فرستادن به روم و ربات
        pushChat(finalText, "user");
        const reply = botReply(finalText);
        pushChat(reply, "bot");
      }
    };

    recognition.start();
  }

  function stopSTT(){
    try{ if(recognition) recognition.stop(); }catch{}
  }

  // Buttons
  $("createBtn").addEventListener("click", () => enterRoom("create"));
  $("joinBtn").addEventListener("click", () => enterRoom("join"));
  $("leaveBtn").addEventListener("click", leaveRoom);
  $("micBtn").addEventListener("click", async () => {
    // فقط شروع STT، مرورگر خودش اجازه میکروفن را می‌خواهد
    if(!room){
      setStatus("اول روم بساز یا وارد شو.");
      return;
    }
    startSTT();
  });
  $("stopBtn").addEventListener("click", () => {
    stopSTT();
    setStatus("قطع شد.");
  });
  $("clearBtn").addEventListener("click", () => {
    chatEl.innerHTML = "";
    log("Chat cleared.");
  });

  // Start state
  setStatus((canSTT ? "مرورگر آماده است. " : "STT پشتیبانی نمی‌شود. ") + "ابتدا روم بساز یا وارد شو.");
  log("Page loaded.");

})();
</script>
</body>
</html>
