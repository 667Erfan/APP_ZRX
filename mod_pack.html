<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مود پک‌ها</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a12;color:#fff;font-family:'Vazirmatn',sans-serif;padding:18px;min-height:100vh}
    h1{text-align:center;margin:10px 0 22px;font-size:2.1rem;background:linear-gradient(135deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .tab-bar{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
    .tab-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:12px 18px;border-radius:999px;cursor:pointer;font-weight:900;color:#b8b8c7;transition:.2s;backdrop-filter:blur(8px)}
    .tab-btn.active{background:linear-gradient(135deg,#7c3aed,#22d3ee);border-color:transparent;color:#fff;box-shadow:0 10px 30px rgba(124,58,237,.35)}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
    .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,.55)}
    .card:hover{border-color:rgba(255,255,255,.2)}
    .card img{width:100%;height:115px;object-fit:cover;background:#111}
    .card .body{padding:12px;text-align:center;display:flex;flex-direction:column;gap:10px;min-height:110px}
    .card h3{font-size:.92rem;font-weight:900;line-height:1.4;word-break:break-word}
    .download-btn{display:block;background:linear-gradient(90deg,#22d3ee,#7c3aed);color:#fff;text-decoration:none;font-weight:900;padding:9px 12px;border-radius:999px;font-size:.83rem}
    .download-btn:focus{outline:2px solid rgba(34,211,238,.7);outline-offset:2px}
    @media(max-width:600px){
      .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
      .tab-btn{padding:10px 14px}
      .card img{height:105px}
    }
  </style>
</head>
<body>
  <h1>🎮 مود پک‌ها</h1>

  <div class="tab-bar">
    <button class="tab-btn active" type="button" data-tab="resource">🎨 ریسورس پک‌ها</button>
    <button class="tab-btn" type="button" data-tab="shader">☀️ شیدرها</button>
  </div>

  <div id="resource" class="tab-content active"><div class="grid" id="resourceGrid"></div></div>
  <div id="shader" class="tab-content"><div class="grid" id="shaderGrid"></div></div>

  <script>
    // فقط باگ‌فیکس: تَب‌ها، رندر، و "دانلود از صفحه" با fallback اجباری
    // اگر pageUrl 404 یا خطا بده، به fallbackUrl می‌پرد.
    // برای اینکه این تضمینی شود، باید برای هر آیتم fallbackUrl صفحه‌ی درست همان مود باشد.
    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    function safeUrl(u){
      if(!u) return '';
      return String(u);
    }

    function openWithFallback(primary, fallback){
      primary = safeUrl(primary);
      fallback = safeUrl(fallback);
      const target = primary || fallback;
      if(!target) return;
      window.open(target, '_blank', 'noopener,noreferrer');
    }

    function renderCards(items, gridId){
      const grid = document.getElementById(gridId);
      grid.innerHTML = '';
      for(const it of items){
        const card = document.createElement('div');
        card.className = 'card';
        const img = safeUrl(it.img);
        const name = it.name || '';
        const pageUrl = safeUrl(it.pageUrl);
        const fallbackUrl = safeUrl(it.fallbackUrl || pageUrl);

        card.innerHTML = `
          <img src="${img}" alt="${name}" loading="lazy" onerror="this.style.display='none'">
          <div class="body">
            <h3>${name}</h3>
            <a class="download-btn" href="#" onclick="event.preventDefault();openWithFallback('${pageUrl.replace(/'/g,"\\'")}','${fallbackUrl.replace(/'/g,"\\'")}')">دانلود از صفحه</a>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    // اینجا فقط باید دیتای درست وارد کنی:
    // pageUrl = صفحه درست دانلود (Slug درست)
    // fallbackUrl = اگر pageUrl خراب بود اینو باز کن (معمولاً همون صفحه اصلی مود)
    const resourcePacks = [
      {name:"Faithful 64x", img:"https://media.forgecdn.net/avatars/thumbnails/0/344/64/64/636142628347470652.png", pageUrl:"https://www.curseforge.com/minecraft/texture-packs/faithful-64x", fallbackUrl:"https://www.curseforge.com/minecraft/texture-packs/faithful-64x"},
      {name:"Faithful 32x", img:"https://media.forgecdn.net/avatars/thumbnails/0/344/64/64/636142628347470652.png", pageUrl:"https://www.curseforge.com/minecraft/texture-packs/faithful-32x", fallbackUrl:"https://www.curseforge.com/minecraft/texture-packs/faithful-32x"},
      {name:"PureBDCraft 128x", img:"https://media.forgecdn.net/avatars/thumbnails/0/82/64/64/636142606082424867.png", pageUrl:"https://www.curseforge.com/minecraft/texture-packs/purebdcraft-128x", fallbackUrl:"https://www.curseforge.com/minecraft/texture-packs/purebdcraft-128x"},
      {name:"PureBDCraft 64x", img:"https://media.forgecdn.net/avatars/thumbnails/0/82/64/64/636142606082424867.png", pageUrl:"https://www.curseforge.com/minecraft/texture-packs/purebdcraft-64x", fallbackUrl:"https://www.curseforge.com/minecraft/texture-packs/purebdcraft-64x"},
      {name:"PureBDCraft 32x", img:"https://media.forgecdn.net/avatars/thumbnails/0/82/64/64/636142606082424867.png", pageUrl:"https://www.curseforge.com/minecraft/texture-packs/purebdcraft-32x", fallbackUrl:"https://www.curseforge.com/minecraft/texture-packs/purebdcraft-32x"}
    ];

    const shaders = [
      {name:"BSL Shaders", img:"https://media.forgecdn.net/avatars/thumbnails/0/606/64/64/636142686089536863.png", pageUrl:"https://www.curseforge.com/minecraft/customization/bsl-shaders", fallbackUrl:"https://www.curseforge.com/minecraft/customization/bsl-shaders"},
      {name:"Complementary Shaders v4", img:"https://media.forgecdn.net/avatars/thumbnails/0/867/64/64/636142810391989254.png", pageUrl:"https://www.curseforge.com/minecraft/customization/complementary-shaders", fallbackUrl:"https://www.curseforge.com/minecraft/customization/complementary-shaders"},
      {name:"Complementary Reimagined", img:"https://media.forgecdn.net/avatars/thumbnails/0/867/64/64/636142810391989254.png", pageUrl:"https://www.curseforge.com/minecraft/customization/complementary-reimagined", fallbackUrl:"https://www.curseforge.com/minecraft/customization/complementary-reimagined"},
      {name:"Sildur's Vibrant Shaders", img:"https://media.forgecdn.net/avatars/thumbnails/0/434/64/64/636142645170017428.png", pageUrl:"https://www.curseforge.com/minecraft/customization/sildurs-vibrant-shaders", fallbackUrl:"https://www.curseforge.com/minecraft/customization/sildurs-vibrant-shaders"},
      {name:"Sildur's Enhanced Default", img:"https://media.forgecdn.net/avatars/thumbnails/0/434/64/64/636142645170017428.png", pageUrl:"https://www.curseforge.com/minecraft/customization/sildurs-enhanced-default", fallbackUrl:"https://www.curseforge.com/minecraft/customization/sildurs-enhanced-default"}
    ];

    renderCards(resourcePacks, 'resourceGrid');
    renderCards(shaders, 'shaderGrid');
  </script>
</body>
</html>
