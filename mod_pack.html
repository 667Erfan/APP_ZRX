<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مود پک‌ها | ریسورس پک و شیدر</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a12;
    font-family: 'Vazirmatn', sans-serif;
    color: #fff;
    padding: 20px;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 2.2rem;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .tab-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 14px 40px;
    border-radius: 60px;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #aaa;
    backdrop-filter: blur(8px);
    font-family: 'Vazirmatn', sans-serif;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #7c3aed, #22d3ee);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 10px 30px rgba(124,58,237,0.4);
  }
  .tab-content {
    display: none;
  }
  .tab-content.active {
    display: block;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 24px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 14px 12px 18px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.06);
    transition: 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
  }
  .card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 14px;
    background: #111;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .card h3 {
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 14px;
    color: #eee;
    word-break: break-word;
  }
  .card .download-btn {
    display: inline-block;
    background: linear-gradient(90deg, #22d3ee, #7c3aed);
    color: #fff;
    font-weight: 700;
    padding: 8px 24px;
    border-radius: 40px;
    text-decoration: none;
    font-size: 0.8rem;
    transition: 0.2s;
    box-shadow: 0 4px 16px rgba(34,211,238,0.3);
    width: 100%;
    text-align: center;
    cursor: pointer;
    border: none;
    font-family: 'Vazirmatn', sans-serif;
  }
  .card .download-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 6px 24px rgba(34,211,238,0.5);
  }
  .loading-msg {
    text-align: center;
    padding: 30px;
    color: #aaa;
    font-size: 1.2rem;
  }
  @media(max-width:600px){
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .tab-btn { padding: 10px 20px; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<h1>🎮 مود پک‌ها</h1>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('resource')">🎨 ریسورس پک‌ها</button>
  <button class="tab-btn" onclick="switchTab('shader')">☀️ شیدرها</button>
</div>

<!-- ========== ریسورس پک ========= -->
<div id="resource" class="tab-content active">
  <div class="grid" id="resourceGrid"></div>
</div>

<!-- ========== شیدر ========= -->
<div id="shader" class="tab-content">
  <div class="grid" id="shaderGrid"></div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
}

// ساخت کارت‌ها با دکمه دانلود مستقیم
function renderCards(data, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${item.img}" alt="${item.name}" loading="lazy">
      <h3>${item.name}</h3>
      <a class="download-btn" href="${item.url}" download>دانلود مستقیم</a>
    `;
    container.appendChild(card);
  });
}

// رندر هر دو بخش
renderCards(resourcePacks, 'resourceGrid');
renderCards(shaders, 'shaderGrid');
