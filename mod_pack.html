<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مود پک‌ها | ریسورس پک و شیدر</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      background:#0a0a12; color:#fff; font-family:'Vazirmatn',sans-serif;
      padding:20px; min-height:100vh;
    }
    h1{
      text-align:center; margin-bottom:24px;
      font-size:2.1rem;
      background:linear-gradient(135deg,#f093fb,#f5576c);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .tab-bar{
      display:flex; justify-content:center; gap:16px; flex-wrap:wrap;
      margin-bottom:28px;
    }
    .tab-btn{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      padding:12px 24px;
      border-radius:999px;
      font-weight:800; font-size:1rem;
      cursor:pointer; color:#b8b8c7;
      backdrop-filter:blur(8px);
      transition:all .2s ease;
    }
    .tab-btn.active{
      background:linear-gradient(135deg,#7c3aed,#22d3ee);
      border-color:transparent; color:#fff;
      box-shadow:0 10px 30px rgba(124,58,237,0.35);
    }
    .tab-content{ display:none; }
    .tab-content.active{ display:block; }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:18px;
    }
    .card{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:18px;
      overflow:hidden;
      backdrop-filter:blur(10px);
      box-shadow:0 8px 20px rgba(0,0,0,0.55);
      transition:.2s;
      display:flex; flex-direction:column;
    }
    .card:hover{ transform:translateY(-5px); border-color:rgba(255,255,255,0.2); }
    .card img{
      width:100%; height:118px; object-fit:cover;
      background:#111;
    }
    .card .body{
      padding:12px 12px 14px;
      text-align:center;
      display:flex; flex-direction:column; gap:10px;
      min-height:110px;
    }
    .card h3{
      font-size:.92rem; line-height:1.45;
      font-weight:900;
      word-break:break-word;
      color:#f1f1ff;
      margin-top:2px;
    }
    .download-btn{
      display:block;
      background:linear-gradient(90deg,#22d3ee,#7c3aed);
      color:#fff; text-decoration:none;
      font-weight:900;
      padding:9px 16px;
      border-radius:999px;
      font-size:.83rem;
      box-shadow:0 4px 16px rgba(34,211,238,0.25);
    }
    @media(max-width:600px){
      .grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
      .tab-btn{ padding:10px 18px; font-size:.95rem; }
      .card img{ height:105px; }
    }
  </style>
</head>
<body>

<h1>🎮 مود پک‌ها</h1>

<div class="tab-bar">
  <button class="tab-btn active" type="button" data-tab="resource">🎨 ریسورس پک‌ها</button>
  <button class="tab-btn" type="button" data-tab="shader">☀️ شیدرها</button>
</div>

<div id="resource" class="tab-content active">
  <div class="grid" id="resourceGrid"></div>
</div>

<div id="shader" class="tab-content">
  <div class="grid" id="shaderGrid"></div>
</div>

<script>
  // تب‌ها بدون باگ
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));

      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // رندر امن
  function renderCards(items, gridId){
    const grid = document.getElementById(gridId);
    grid.innerHTML = '';
    for(const it of items){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${it.img}" alt="${it.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="body">
          <h3>${it.name}</h3>
          <a class="download-btn" href="${it.pageUrl}" target="_blank" rel="noopener">دانلود از صفحه</a>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  // دقت: اینجا به جای لینک دانلود مستقیم (که ممکنه 403/AccessDenied بده)، لینک “صفحه رسمی” می‌ذاریم.
  // این باعث میشه 404 نیاد و کاربر هم راحت دانلود کنه.

  const shaders = [

    { name:"Sildur's Vibrant Shaders", img:"https://media.forgecdn.net/avatars/thumbnails/0/434/64/64/636142645170017428.png", pageUrl:"https://www.curseforge.com/minecraft/customization/sildurs-vibrant-shaders" },

  renderCards(resourcePacks, 'resourceGrid');
  renderCards(shaders, 'shaderGrid');

</body>
</html>
